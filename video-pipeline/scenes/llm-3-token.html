<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Audio-LLM · 3: Bao nhiêu token</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/llm.js"></script>
<script src="../build/llm-3-token.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Ba khối, ba giai đoạn', '3 Bao nhiêu token', '4 Đọc câu trả lời'];
const B = {x: 160, y: 330, w: 1600};
const CW = B.w / 790;

function strip(sec) {
  const k = LLM.tokens(sec);
  let x = B.x;
  [[k.sys, '#bdbcb8', 'hệ thống'], [k.audio, COL.acc, 'âm thanh'], [k.prompt, COL.frame, 'câu lệnh']].forEach(([n, c, l]) => {
    rrect(x, B.y, Math.max(2, n * CW - 2), 80, 6, c);
    if (n * CW > 110) text(`${l} (${n})`, x + 10, B.y + 40, {size: 22, weight: 700, color: '#fff'});
    x += n * CW;
  });
  text('đầu vào của LLM, thang tối đa 30 giây', B.x, B.y - 24, {size: 20, color: COL.mute});
  const tot = k.sys + k.audio + k.prompt;
  text(`${sec} giây × 25 = ${k.audio} token âm thanh · cả đầu vào ≈ ${tot} token`, 960, B.y + 150, {size: 30, weight: 700, align: 'center'});
  return tot;
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('Audio-LLM', 'Phần 3/4: âm thanh chiếm bao nhiêu chỗ', 2, PARTS);

function shotStrip(G, t) {
  const sr = S('rate'), s4 = S('s4'), s30 = S('s30'), d30 = D('s30'), sq = S('quad'), dq = D('quad');
  heading(t < s4 ? '40 ms âm thanh = 1 token' : t < sq ? 'Câu lệnh vài chục token, âm thanh hàng trăm' : 'Self-attention tốn theo bình phương độ dài');
  if (t < s4) {
    fade(G, P(t, sr + 0.3, 0.5), () => {
      for (let k = 0; k < 25; k++) rrect(260 + k * 56, 360, 48, 80, 6, COL.acc + (k % 2 ? 'cc' : 'ff'));
      text('1 giây = 25 token âm thanh', 960, 500, {size: 32, weight: 700, color: COL.acc, align: 'center'});
    });
    return;
  }
  const sec = t < s30 ? 4 : Math.round(lerp(4, 30, P(t, s30 + 0.3, d30 * 0.4)));
  fade(G, P(t, s4 + 0.3, 0.5), () => strip(sec));
  if (t >= sq) fade(G, P(t, sq + 0.3, 0.5), () => {
    const sz = n => Math.sqrt(n * n) / 790 * 220;
    rrect(560, 560, sz(140), sz(140), 4, COL.ok);
    text('140² ≈ 19 600', 560, 820, {size: 24, weight: 700, color: COL.ok});
    rrect(1000, 560, 220, 220, 4, COL.hl);
    text('790² ≈ 624 000', 1000, 820, {size: 24, weight: 700, color: COL.hl});
    fade(G, P(t, sq + dq * 0.4, 0.5), () => text('≈ 32 lần · encoder Whisper tối đa 30 giây', 1260, 680, {size: 26, weight: 700}));
  });
}

function shotCost(G, t) {
  const ss = S('slow'), sm = S('mem');
  heading(t < sm ? 'Sinh tự hồi quy: chậm' : 'Bộ nhớ');
  if (t < sm) {
    fade(G, P(t, ss + 0.3, 0.5), () => {
      const n = Math.floor(P(t, ss + 0.6, 3) * 8);
      ['The', 'speaker', 'sounds', 'happy', 'and', 'excited', '.', '<eos>'].slice(0, n).forEach((w, j) => {
        chip(G, 260 + j * 180, 340, w, {size: 26, weight: 700, color: COL.acc, stroke: COL.acc});
      });
      text('mỗi token: chạy cả mô hình 7 tỉ tham số một lượt', 960, 500, {size: 28, weight: 700, align: 'center'});
      text('SenseVoice (CTC): mọi vị trí một lượt · audio-LLM: chậm hơn nhiều', 960, 570, {size: 26, color: COL.mute, align: 'center'});
    });
    return;
  }
  fade(G, P(t, sm + 0.3, 0.5), () => {
    text('8,2 tỉ tham số × 2 byte (16 bit)', 960, 340, {size: 40, weight: 700, mono: true, align: 'center'});
    text('≈ 16 GB bộ nhớ GPU chỉ để chứa trọng số', 960, 440, {size: 34, weight: 700, color: COL.hl, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['25 token mỗi giây âm thanh: chiếm phần lớn đầu vào'], ['attention bình phương, sinh tự hồi quy'], ['≈ 16 GB trọng số: chậm và nặng']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.4, 0.6), () => {
      text('!', 400, 300 + j * 90, {size: 34, weight: 700, color: COL.frame});
      text(a, 450, 300 + j * 90, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 770, 640, 'Phần 4: đọc câu trả lời tự do  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 3', [
  ['một vector âm thanh đưa vào LLM', '"token" âm thanh', '≈ 40 ms'],
  ['chi phí tăng theo bình phương', 'O(n²) của self-attention', ''],
  ['số thực 16 bit', 'fp16 / bf16', '2 byte mỗi tham số'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'rate', to: 'quad', draw: shotStrip},
    {from: 'slow', to: 'mem', draw: shotCost},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/llm-3-token.wav');
</script>
</body>
</html>
