<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HMM 2: Ba thành phần</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/hmm.js"></script>
<script src="../build/hmm-2-thanh-phan.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Thành phần', '3 Tự lặp, độ dài', '4 Viterbi', '5 Forward, Baum-Welch'];
const TR = HMM.TRUTH, RX = 250, RW = 38;
const SX = [460, 760, 1060], SY = 300;

// Small mixture-of-two-bells sketch standing for one state's GMM.
function miniGmm(x, y, w, h, s) {
  const c = HMM.stateCol(s), mus = [[0.35, 0.6], [0.45, 0.55], [0.55, 0.4]][s];
  const f = u => 0.55 * Math.exp(-(((u - mus[0]) / 0.1) ** 2)) + 0.45 * Math.exp(-(((u - mus[1]) / 0.14) ** 2));
  const xs = [], ys = [];
  for (let k = 0; k <= 60; k++) { const u = k / 60; xs.push(x + 14 + u * (w - 28)); ys.push(y + h - 14 - f(u) * (h - 50)); }
  card(x, y, w, h, {stroke: c});
  poly(xs, ys, c, 3);
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('HMM', 'Phần 2/5: ba thành phần, ba thuật toán', 1, PARTS);

function shotName(G, t) {
  const s = S('name');
  heading('Tên gọi');
  fade(G, P(t, s + 0.3, 0.6), () => {
    text('Hidden Markov Model', 960, 360, {size: 64, weight: 700, color: COL.acc, align: 'center'});
    text('mô hình Markov ẩn', 960, 450, {size: 36, color: COL.mute, align: 'center'});
  });
  [['1', 'trạng thái'], ['2', 'xác suất chuyển'], ['3', 'xác suất phát']].forEach(([n, l], j) =>
    fade(G, P(t, s + 1.6 + j * 0.5, 0.5), () => {
      card(390 + j * 400, 560, 340, 120);
      text(n, 440 + j * 400, 620, {size: 44, weight: 700, color: COL.frame, align: 'center'});
      text(l, 490 + j * 400, 620, {size: 30, weight: 700});
    }));
}

function shotParts(G, t) {
  const ss = S('state'), st = S('trans'), se = S('emit'), sg = S('gmmhmm'), de = D('emit');
  heading('Ba thành phần');
  const legend = [['1 trạng thái (state)', COL.ink, ss], ['2 xác suất chuyển (transition)', COL.ink, st], ['3 xác suất phát (emission)', COL.ink, se]];
  legend.forEach(([l, c, s0], j) => fade(G, P(t, s0 + 0.2, 0.5), () => {
    const on = t >= s0 && (j === 2 ? t < sg : t < legend[j + 1][2]);
    text(l, 1430, 300 + j * 60, {size: 26, weight: on ? 700 : 400, color: on ? COL.frame : COL.mute});
  }));

  fade(G, P(t, ss + 0.3, 0.6), () => {
    SX.forEach((x, k) => HMM.stateBox(x, SY, k, {loop: t >= st + 0.8}));
    fade(G, P(t, ss + D('state') * 0.45, 0.6) * (1 - P(t, st, 0.4)), () => {
      text('ẩn: chỉ nghe âm thanh, không thấy trạng thái', 820, 445, {size: 24, color: COL.mute, align: 'center'});
    });
  });

  fade(G, P(t, st + 0.3, 0.6), () => {
    [0, 1].forEach(k => {
      arrow(SX[k] + 130, SY + 45, SX[k + 1] - 10, SY + 45, COL.mute, 3);
      text('1 − p', (SX[k] + SX[k + 1] + 120) / 2, SY + 20, {size: 24, weight: 700, color: COL.mute, align: 'center'});
    });
    fade(G, P(t, st + 0.8, 0.5), () => SX.forEach((x, k) => text('p', x + 60, SY - 66, {size: 26, weight: 700, color: HMM.stateCol(k), align: 'center'})));
    fade(G, P(t, st + D('trans') * 0.6, 0.5), () => {
      const g = Clip.g;
      g.save(); g.setLineDash([8, 6]);
      g.beginPath(); g.moveTo(SX[1] + 30, SY + 100); g.quadraticCurveTo(SX[1] - 90, SY + 150, SX[0] + 90, SY + 100);
      g.strokeStyle = COL.hl; g.lineWidth = 2.5; g.stroke(); g.restore();
      arrow(SX[0] + 100, SY + 106, SX[0] + 90, SY + 100, COL.hl, 2.5, 12);
      text('✗ quay lui', SX[1] - 150, SY + 150, {size: 22, weight: 700, color: COL.hl, align: 'center'});
    });
  });

  fade(G, P(t, se + 0.3, 0.6), () => {
    SX.forEach((x, k) => {
      line(x + 60, SY + 92, x + 60, 540, HMM.stateCol(k), 2, [5, 5]);
      miniGmm(x - 20, 540, 160, 110, k);
      text(`p(frame | ${HMM.STATES[k]})`, x + 60, 676, {size: 22, weight: 700, color: HMM.stateCol(k), align: 'center'});
    });
  });
  fade(G, P(t, se + de * 0.45, 0.6), () => {
    HMM.row(RX, 740, TR, {h: 40, size: 20});
    [[0, 10], [10, 28], [28, 40]].forEach(([a, b], k) => arrow(SX[k] + 60, 690, RX + (a + b) / 2 * RW, 734, HMM.stateCol(k) + '99', 2));
  });

  fade(G, P(t, sg + 0.3, 0.6), () => {
    rrect(380, 200, 1000, 500, 20, null, COL.acc, 3);
    chip(G, 400, 174, 'GMM-HMM', {fill: COL.accSoft, stroke: COL.acc, color: COL.acc, weight: 700, size: 26});
    text('chuẩn của nhận dạng tiếng nói đến khoảng 2012', 1430, 520, {size: 26, color: COL.acc, weight: 700, maxW: 380});
  });
}

function shotAlgo(G, t) {
  const s = S('algo'), d = D('algo');
  heading('Ba thuật toán, ba câu hỏi');
  [['Viterbi', 'chia frame cho trạng thái thế nào là tốt nhất?', 'phần 4'],
   ['Forward', 'chuỗi frame khớp với từ này tổng cộng bao nhiêu?', 'phần 5'],
   ['Baum-Welch', 'học xác suất chuyển và GMM từ dữ liệu thế nào?', 'phần 5']].forEach(([n, q, p], j) =>
    fade(G, P(t, s + 1 + j * d * 0.27, 0.6), () => {
      const x = 180 + j * 540;
      card(x, 300, 480, 380, {stroke: COL.acc});
      text(n, x + 240, 370, {size: 38, weight: 700, color: COL.acc, align: 'center'});
      text(q, x + 40, 460, {size: 28, maxW: 400});
      chip(G, x + 40, 600, p);
    }));
}

function shotMarkov(G, t) {
  const s = S('markov'), d = D('markov');
  heading('Giả định Markov');
  const xs = [360, 720, 1080, 1440];
  ['t − 3', 't − 2', 't − 1', 't'].forEach((l, j) => fade(G, P(t, s + 0.3 + j * 0.2, 0.5), () => {
    rrect(xs[j], 330, 140, 100, 14, j === 3 ? COL.frameSoft : COL.card, j === 3 ? COL.frame : COL.line2, 2.5);
    text(l, xs[j] + 70, 380, {size: 30, weight: 700, color: j === 3 ? COL.frame : COL.ink, align: 'center'});
  }));
  fade(G, P(t, s + 1.6, 0.6), () => {
    arrow(xs[2] + 150, 380, xs[3] - 10, 380, COL.ok, 4, 16);
    text('chỉ cần frame ngay trước', 1290, 470, {size: 26, weight: 700, color: COL.ok, align: 'center'});
  });
  fade(G, P(t, s + d * 0.45, 0.6), () => {
    const g = Clip.g;
    [0, 1].forEach(j => {
      g.save(); g.setLineDash([8, 6]); g.beginPath();
      g.moveTo(xs[j] + 70, 320); g.quadraticCurveTo((xs[j] + xs[3]) / 2 + 70, 190 - j * 20, xs[3] + 70, 320);
      g.strokeStyle = COL.line2; g.lineWidth = 2.5; g.stroke(); g.restore();
    });
    text('✗ không cần nhớ xa hơn', 1100, 210, {size: 24, weight: 700, color: COL.hl});
  });
  fade(G, P(t, s + d * 0.75, 0.6), () => {
    card(560, 560, 800, 120, {stroke: COL.acc});
    text('→ thuật toán chỉ cần nhìn từng cặp frame liền nhau: chạy nhanh', 960, 620, {size: 26, weight: 700, color: COL.acc, align: 'center', maxW: 740});
  });
}

function shotMarkov2(G, t) {
  const s = S('markov2'), d = D('markov2');
  heading('Andrey Markov, 1913');
  fade(G, P(t, s + 0.3, 0.6), () => {
    card(260, 260, 620, 420);
    text('"Eugene Onegin" (Pushkin)', 300, 320, {size: 30, weight: 700});
    text('đếm 20 000 chữ cái đầu', 300, 380, {size: 26, color: COL.mute});
    text('mỗi chữ: nguyên âm (V) hay phụ âm (C)?', 300, 430, {size: 26, color: COL.mute});
    const seq = 'CVCCVCVVCCVCVC'.split('');
    seq.forEach((c, j) => fade(G, P(t, s + 1.2 + j * 0.1, 0.3), () => {
      rrect(300 + j * 38, 500, 34, 44, 5, c === 'V' ? COL.accSoft : COL.soft, c === 'V' ? COL.acc : COL.line2, 1.5);
      text(c, 317 + j * 38, 522, {size: 22, weight: 700, color: c === 'V' ? COL.acc : COL.mute, align: 'center'});
    }));
  });
  fade(G, P(t, s + d * 0.5, 0.6), () => {
    card(1000, 260, 660, 420, {stroke: COL.acc});
    text('chữ sau là nguyên âm, nếu chữ trước là:', 1040, 320, {size: 26, color: COL.mute});
    [['nguyên âm', 0.128], ['phụ âm', 0.663]].forEach(([l, v], j) => {
      const y = 400 + j * 110, u = P(t, s + d * 0.5 + 0.5 + j * 0.4, 0.8);
      text(l, 1040, y, {size: 28, weight: 700});
      rrect(1200, y - 18, 360 * v * u, 36, 6, COL.acc);
      text(`${Math.round(v * 1000) / 10}%`.replace('.', ','), 1212 + 360 * v * u, y, {size: 26, weight: 700, color: COL.acc});
    });
    text('chữ ngay trước đổi hẳn xác suất', 1040, 630, {size: 26, weight: 700, color: COL.acc});
  });
}

function shotHist(G, t) {
  const s = S('hist'), d = D('hist');
  heading('Lịch sử');
  // Broken axis: 1913 sits alone on the left so the crowded 1960s-1980s get the width.
  const X = y => (y < 1950 ? 340 : 640 + (y - 1960) / 32 * 1040), Y0 = 500;
  fade(G, P(t, s + 0.2, 0.6), () => {
    line(220, Y0, 470, Y0, COL.line2, 3); line(510, Y0, 1720, Y0, COL.line2, 3);
    line(478, Y0 + 12, 492, Y0 - 12, COL.line2, 2); line(490, Y0 + 12, 504, Y0 - 12, COL.line2, 2);
    [1960, 1970, 1980, 1990].forEach(y => { line(X(y), Y0 - 8, X(y), Y0 + 8, COL.line2, 2); text(String(y), X(y), Y0 + 34, {size: 20, color: COL.mute, align: 'center'}); });
  });
  [[1913, ['Markov'], 'chuỗi chữ cái', -1, 0.05],
   [1966, ['Baum và cộng sự'], 'toán học HMM', -1, 0.15],
   [1967, ['Viterbi'], 'giải mã kênh truyền', 1, 0.3],
   [1975, ['Baker (Dragon)', 'Jelinek (IBM)'], 'HMM cho tiếng nói', -1, 0.5],
   [1989, ['Rabiner'], 'bài tổng quan', 1, 0.75]].forEach(([y, a, b, side, at]) =>
    fade(G, P(t, s + d * at, 0.6), () => {
      const x = X(y), n = a.length, ty = Y0 + side * (130 + (side < 0 ? 34 * (n - 1) : 0));
      line(x, Y0, x, Y0 + side * (side < 0 ? 40 : 100), COL.acc, 2);
      Clip.g.beginPath(); Clip.g.arc(x, Y0, 9, 0, Math.PI * 2); Clip.g.fillStyle = COL.acc; Clip.g.fill();
      text(String(y), x, ty, {size: 24, weight: 700, color: COL.acc, align: 'center'});
      a.forEach((l, j) => text(l, x, ty + 36 + j * 34, {size: 25, weight: 700, align: 'center'}));
      text(b, x, ty + 36 + n * 34, {size: 22, color: COL.mute, align: 'center'});
    }));
}

function shotResult(G, t) {
  const s = S('result'), d = D('result');
  heading('Tóm lại');
  fade(G, P(t, s + 0.3, 0.6), () => {
    text('HMM =', 340, 330, {size: 38, weight: 700});
    [['trạng thái có thứ tự', COL.ink], ['xác suất chuyển', COL.ink], ['xác suất phát (GMM)', COL.ink]].forEach(([l], j) =>
      fade(G, P(t, s + 0.8 + j * 0.6, 0.5), () => {
        card(500 + j * 390, 280, 360, 100, {stroke: COL.frame});
        text(l, 680 + j * 390, 330, {size: 28, weight: 700, color: COL.frame, align: 'center'});
      }));
  });
  fade(G, P(t, s + d * 0.45, 0.6), () => {
    text('thuật toán:', 340, 480, {size: 32, weight: 700});
    ['Viterbi', 'Forward', 'Baum-Welch'].forEach((l, j) => chip(G, 540 + j * 230, 454, l, {fill: COL.accSoft, stroke: COL.acc, color: COL.acc, weight: 700}));
  });
  fade(G, P(t, s + d * 0.8, 0.5), () => chip(G, 760, 640, 'Phần 3: vòng tự lặp và độ dài  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 2', [
  ['mô hình Markov ẩn', 'HMM (Hidden Markov Model)', 'trạng thái + chuyển + phát'],
  ['trạng thái', 'state', 'không thấy trực tiếp, nên gọi là ẩn'],
  ['xác suất chuyển', 'transition probability', 'ở lại (p) hoặc sang kế (1 − p)'],
  ['vòng tự lặp', 'self-loop', 'cho phép một âm kéo dài'],
  ['xác suất phát', 'emission probability', 'p(frame | trạng thái), do GMM chấm'],
  ['GMM-HMM', 'GMM-HMM', 'cấu hình chuẩn đến khoảng 2012'],
  ['chỉ nhớ bước ngay trước', 'giả định Markov', 'làm thuật toán chạy nhanh'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'name', to: 'name', draw: shotName},
    {from: 'state', to: 'gmmhmm', draw: shotParts},
    {from: 'algo', to: 'algo', draw: shotAlgo},
    {from: 'markov', to: 'markov', draw: shotMarkov},
    {from: 'markov2', to: 'markov2', draw: shotMarkov2},
    {from: 'hist', to: 'hist', draw: shotHist},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/hmm-2-thanh-phan.wav');
</script>
</body>
</html>
