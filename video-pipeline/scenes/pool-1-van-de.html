<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Từ frame đến câu · 1: Vấn đề</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/pool-1-van-de.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Bốn công cụ', '3 Pooling', '4 Trộn tầng', '5 Probe / fine-tune', '6 emotion2vec'];
const PAINS = [
  ['p1', 'câu 3 giây ra 150 vector', 'mỗi 20 ms một vector; bộ phân loại cần đúng một'],
  ['p2', 'cảm xúc chỉ ở một đoạn', '"Ừ… được thôi. NHƯNG LẦN SAU THÌ ĐỪNG!": giận ở nửa sau'],
  ['p3', 'encoder 12 hoặc 24 tầng', 'tầng cuối (học cho ASR) giữ nội dung, bớt cách nói'],
  ['p4', 'huấn luyện lại cả encoder thì tốn', 'WavLM-large > 300 triệu tham số, IEMOCAP 5 531 câu: dễ học thuộc'],
];

/* ---------- shots ---------- */

const shotIntro = UI.introShot('Từ frame đến cả câu', 'Phần 1/6: encoder ra quá nhiều vector, ở quá nhiều tầng', 0, PARTS);

function shotPlace(G, t) {
  const s = S('place'), d = D('place');
  heading('Encoder: một vector mỗi frame · SER: một nhãn mỗi câu');
  fade(G, P(t, s + 0.3, 0.5), () => {
    const n = Math.floor(P(t, s + 0.6, d * 0.4) * 30);
    for (let k = 0; k < n; k++) rrect(260 + k * 34, 300, 26, 140, 5, COL.acc + (k > 18 && k < 26 ? 'ff' : '66'));
    text('vector của từng frame (encoder trang 12)', 260, 270, {size: 24, color: COL.acc});
  });
  fade(G, P(t, s + d * 0.55, 0.5), () => {
    arrow(760, 470, 760, 560, COL.mute, 3);
    text('?', 800, 520, {size: 40, weight: 700, color: COL.hl});
    chip(G, 640, 580, 'một nhãn: "giận"', {size: 30, weight: 700, color: COL.hl, stroke: COL.hl});
  });
}

function shotPain(G, t) {
  heading('Bốn vấn đề');
  PAINS.forEach(([id, a, b], j) => fade(G, P(t, S(id) + 0.2, 0.5), () => {
    const y = 210 + j * 150, on = t >= S(id) && t < E(id) + 0.3;
    card(240, y, 1440, 130, {stroke: on ? COL.hl : COL.line, lw: on ? 3 : 2});
    text(a, 280, y + 48, {size: 30, weight: 700, color: COL.hl});
    text(b, 280, y + 98, {size: 24, color: COL.mute, maxW: 1360});
  }));
}

function shotGoal(G, t) {
  const s = S('goal'), d = D('goal');
  heading('Mục tiêu');
  [['gộp frame thành một vector câu, không làm loãng đoạn cảm xúc', 'phần 3'], ['chọn đúng tầng chứa cảm xúc', 'phần 4'], ['quyết định huấn luyện bao nhiêu phần encoder', 'phần 5, 6']].forEach(([l, p], j) =>
    fade(G, P(t, s + 0.3 + j * d * 0.25, 0.5), () => {
      text('✓', 340, 310 + j * 100, {size: 34, weight: 700, color: COL.ok});
      text(l, 390, 310 + j * 100, {size: 30});
      text(p, 1580, 310 + j * 100, {size: 24, color: COL.frame, align: 'right'});
    }));
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['nhiều frame, một nhãn'], ['cảm xúc chỉ ở một đoạn'], ['nhiều tầng, encoder to']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.4, 0.6), () => {
      text('✗', 640, 300 + j * 90, {size: 34, weight: 700, color: COL.hl});
      text(a, 690, 300 + j * 90, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 800, 640, 'Phần 2: bốn công cụ  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 1', [
  ['một vector cho mỗi frame', 'frame-level features', 'mỗi 20 ms'],
  ['một vector cho cả câu', 'utterance-level embedding', ''],
  ['tầng của encoder', 'layer (hidden state)', '12 hoặc 24 tầng'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'place', to: 'place', draw: shotPlace},
    {from: 'p1', to: 'p4', draw: shotPain},
    {from: 'goal', to: 'goal', draw: shotGoal},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/pool-1-van-de.wav');
</script>
</body>
</html>
