<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>HMM 4: Viterbi</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/hmm.js"></script>
<script src="../build/hmm-4-viterbi.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Thành phần', '3 Tự lặp, độ dài', '4 Viterbi', '5 Forward, Baum-Welch'];
const TR = HMM.TRUTH, PE = 0.9;
const SC = HMM.scores(5, 1.0), PF = HMM.perFrame(SC), VT = HMM.viterbi(SC, PE);
const SCN = HMM.scores(5, 2.2), PFN = HMM.perFrame(SCN), VTN = HMM.viterbi(SCN, PE).path;
const BX = {x: 260, y: 250, w: 1520, h: 300};
const errs = p => p.filter((s, i) => s !== TR[i]).length;

// Three ways to reach cell (20, a): m→a boundary at frame 4, 10 or 15. Same continuation afterwards.
const CELL = 20, ALTS = [4, 10, 15].map(b => Array.from({length: CELL + 1}, (_, t) => (t < b ? 0 : 1)));
const pathScore = p => p.reduce((acc, s, t) => acc + SC[t][s] + (t === 0 ? 0 : Math.log(s === p[t - 1] ? PE : 1 - PE)), 0);
const ALT_SC = ALTS.map(pathScore), BEST_ALT = ALT_SC.indexOf(Math.max(...ALT_SC));

function dot(x, y, r, c) { const g = Clip.g; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = c; g.fill(); }
function naiveDots(tr, upto = 1) {
  PF.forEach((s, t) => {
    if (t >= upto * PF.length) return;
    const bad = s !== TR[t];
    dot(tr.cx(t), tr.cy(s), bad ? 9 : 7, bad ? COL.hl : COL.frame);
  });
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('HMM', 'Phần 4/5: Viterbi, tìm cách chia frame tốt nhất', 3, PARTS);

function shotGrid(G, t) {
  const st = S('trellis'), sn = S('naive'), sc = S('count'), dc = D('count');
  heading(t < sc ? 'Lưới trellis: 3 trạng thái × 40 frame' : 'Bao nhiêu đường hợp lệ?');
  const tr = HMM.trellis(BX, SC, {cols: Math.ceil(40 * P(t, st + 0.3, 2))});
  fade(G, P(t, st + D('trellis') * 0.5, 0.5), () => {
    text('frame →', BX.x + BX.w, BX.y + BX.h + 30, {size: 22, color: COL.mute, align: 'right'});
    text('ô đậm = GMM chấm cao', BX.x, BX.y + BX.h + 30, {size: 22, color: COL.mute});
  });
  fade(G, P(t, sn + 0.3, 0.5) * (1 - P(t, sc, 0.5) * 0.7), () => {
    naiveDots(tr, P(t, sn + 0.3, 1.5));
    fade(G, P(t, sn + 2, 0.5) * (1 - P(t, sc, 0.4)), () => {
      card(760, 640, 400, 90, {stroke: COL.hl, lw: 2.5});
      text(`chọn từng cột: sai ${errs(PF)}`, 960, 685, {size: 28, weight: 700, color: COL.hl, align: 'center'});
    });
  });
  fade(G, P(t, sc + 0.3, 0.5), () => {
    const p = [...Array(13).fill(0), ...Array(15).fill(1), ...Array(12).fill(2)];
    HMM.path(tr, p, COL.ink, 4, P(t, sc + 0.4, 1.2));
    fade(G, P(t, sc + 1.6, 0.4), () => {
      const g = Clip.g;
      g.save(); g.setLineDash([7, 6]);
      poly([tr.cx(30), tr.cx(31), tr.cx(32)], [tr.cy(2), tr.cy(1), tr.cy(1)], COL.hl, 3);
      g.restore();
      text('✗ đi lên', tr.cx(31), tr.cy(1) - 30, {size: 22, weight: 700, color: COL.hl, align: 'center'});
    });
  });
  fade(G, P(t, sc + dc * 0.35, 0.5), () => {
    card(300, 640, 560, 150, {stroke: COL.acc});
    text('40 frame, 3 âm', 340, 690, {size: 24, color: COL.mute});
    text('741 cách chia', 340, 745, {size: 36, weight: 700, color: COL.acc});
  });
  fade(G, P(t, sc + dc * 0.6, 0.5), () => {
    card(1060, 640, 560, 150, {stroke: COL.hl});
    text('câu 3 giây, 30 trạng thái', 1100, 690, {size: 24, color: COL.mute});
    text('≈ 10⁴⁰ cách: không thử hết', 1100, 745, {size: 36, weight: 700, color: COL.hl});
  });
}

function shotIdea(G, t) {
  const s = S('idea'), d = D('idea');
  heading('Ý tưởng: mỗi ô chỉ giữ một đường tốt nhất');
  const tr = HMM.trellis(BX, SC);
  const g = Clip.g;
  ALTS.forEach((p, j) => fade(G, P(t, s + 0.5 + j * 0.6, 0.5), () => {
    const win = j === BEST_ALT && t > s + d * 0.45;
    if (!win) { g.save(); g.setLineDash([8, 6]); }
    HMM.path(tr, p, win ? COL.ink : COL.mute, win ? 5 : 3);
    if (!win) g.restore();
  }));
  fade(G, P(t, s + 0.5, 0.5), () => {
    g.beginPath(); g.arc(tr.cx(CELL), tr.cy(1), 20, 0, Math.PI * 2); g.strokeStyle = COL.frame; g.lineWidth = 4; g.stroke();
  });
  fade(G, P(t, s + d * 0.45, 0.5), () => {
    HMM.path(tr, VT.path, COL.ink + '55', 4);
    text('phần sau giống hệt nhau', tr.cx(31), tr.cy(2) + 80, {size: 24, weight: 700, color: COL.mute, align: 'center'});
  });
  fade(G, P(t, s + d * 0.6, 0.5), () => {
    card(460, 640, 1000, 120, {stroke: COL.acc});
    text('đường thua ở ô này thì thua ở mọi đường đi tiếp → bỏ luôn', 960, 700, {size: 28, weight: 700, color: COL.acc, align: 'center'});
  });
}

function shotFormula(G, t) {
  const s = S('formula'), d = D('formula');
  heading('Công thức một ô');
  fade(G, P(t, s + 0.3, 0.6), () => {
    text('điểm(t, s) = GMM(t, s) + max(', 260, 300, {size: 40, weight: 700});
    text('điểm(t−1, s) + log p', 900, 380, {size: 34, weight: 700, color: COL.acc});
    text('điểm(t−1, s−1) + log(1−p)', 900, 450, {size: 34, weight: 700, color: COL.frame});
    text(')', 1420, 450, {size: 40, weight: 700});
    text('ở lại', 820, 380, {size: 24, color: COL.acc, align: 'right'});
    text('đi xuống', 820, 450, {size: 24, color: COL.frame, align: 'right'});
  });
  fade(G, P(t, s + d * 0.4, 0.6), () => {
    const x0 = 760, y0 = 560, cw = 140, ch = 90;
    [[0, 0, 's − 1'], [0, 1, 's'], [1, 1, 's']].forEach(([c, r]) => rrect(x0 + c * (cw + 120), y0 + r * (ch + 30), cw, ch, 10, COL.card, COL.line2, 2));
    text('t − 1', x0 + cw / 2, y0 - 26, {size: 22, color: COL.mute, align: 'center'});
    text('t', x0 + cw + 120 + cw / 2, y0 - 26, {size: 22, color: COL.mute, align: 'center'});
    text('s − 1', x0 - 20, y0 + ch / 2, {size: 22, color: COL.mute, align: 'right'});
    text('s', x0 - 20, y0 + ch + 30 + ch / 2, {size: 22, color: COL.mute, align: 'right'});
    arrow(x0 + cw + 6, y0 + ch / 2 + 10, x0 + cw + 114, y0 + ch + 30 + ch / 2 - 10, COL.frame, 3);
    arrow(x0 + cw + 6, y0 + ch + 30 + ch / 2, x0 + cw + 114, y0 + ch + 30 + ch / 2, COL.acc, 3);
    rrect(x0 + cw + 120, y0 + ch + 30, cw, ch, 10, COL.frameSoft, COL.frame, 3);
  });
  fade(G, P(t, s + d * 0.75, 0.6), () => {
    card(1220, 580, 460, 120, {stroke: COL.frame});
    text('ô nhớ mình đến từ đâu', 1450, 640, {size: 26, weight: 700, color: COL.frame, align: 'center'});
  });
}

function backPointers(tr, cols) {
  for (let t = 1; t < cols; t++) for (let s = 0; s < 3; s++) {
    if (VT.V[t][s] === -Infinity) continue;
    const b = VT.B[t][s];
    line(tr.cx(t - 1) + 6, tr.cy(b), tr.cx(t) - 8, tr.cy(s), '#00000030', 1.5);
  }
}

function shotFill(G, t) {
  const sf = S('fill'), sb = S('back'), db = D('back');
  heading(t < sb ? 'Điền từ trái sang phải' : 'Lần ngược từ ô cuối');
  const cols = Math.ceil(40 * P(t, sf + 0.3, D('fill') * 0.8));
  const tr = HMM.trellis(BX, SC, {cols});
  backPointers(tr, cols);
  if (t < sb) {
    const c = Math.min(39, cols);
    rrect(tr.cx(c) - tr.cw / 2, BX.y - 6, tr.cw, BX.h + 12, 6, null, COL.frame, 3);
  }
  fade(G, P(t, sb + 0.3, 0.5), () => {
    const u = P(t, sb + 0.5, db * 0.4), n = VT.path.length;
    const rev = VT.path.map((_, k) => n - 1 - k);
    poly(rev.map(k => tr.cx(k)), rev.map(k => tr.cy(VT.path[k])), COL.ink, 5, null, u);
    dot(tr.cx(39), tr.cy(2), 10, COL.ink);
  });
  fade(G, P(t, sb + db * 0.5, 0.5), () => {
    HMM.row(BX.x, 640, VT.path, {w: BX.w / 40, h: 40, size: 18, truth: TR});
    card(760, 720, 400, 80, {stroke: COL.ok, lw: 2.5});
    text(`đúng ${40 - errs(VT.path)} / 40 frame`, 960, 760, {size: 28, weight: 700, color: COL.ok, align: 'center'});
  });
}

function shotWhy(G, t) {
  const s = S('why'), d = D('why');
  heading('Vì sao sửa được frame lẻ?');
  const w = 38, x0 = 260;
  fade(G, P(t, s + 0.3, 0.5), () => {
    text('chấm từng frame', x0 - 20, 302, {size: 22, weight: 700, color: COL.frame, align: 'right'});
    HMM.row(x0, 280, PF, {w, truth: TR});
    text('Viterbi', x0 - 20, 382, {size: 22, weight: 700, color: COL.ok, align: 'right'});
    HMM.row(x0, 360, VT.path, {w, truth: TR});
    rrect(x0 + 3 * w - 5, 272, w + 6, 140, 8, null, COL.hl, 3);
  });
  fade(G, P(t, s + 1.2, 0.5), () => {
    card(300, 470, 620, 270, {stroke: COL.hl});
    text('frame 4: "a" hơn "m" chỉ 0,1', 340, 520, {size: 26, weight: 700, color: COL.hl});
    text('nhảy sang "a" rồi về "m": bị cấm', 340, 580, {size: 25});
    text('nhảy ra, nhảy vào: mỗi lần trả', 340, 640, {size: 25});
    text('log(1 − p) = log 0,1 ≈ −2,3', 340, 690, {size: 25, weight: 700, color: COL.frame});
  });
  fade(G, P(t, s + d * 0.6, 0.5), () => {
    card(1000, 470, 620, 270, {stroke: COL.ok});
    text('một frame lạ', 1040, 540, {size: 28, weight: 700});
    text('không đủ điểm để bù', 1040, 600, {size: 28, weight: 700, color: COL.ok});
    text('→ đường ở lại "m"', 1040, 670, {size: 25, color: COL.mute});
  });
}

function shotNoise(G, t) {
  const s = S('noise'), d = D('noise');
  heading('Tăng nhiễu lên');
  const w = 38, x0 = 240;
  fade(G, P(t, s + 0.3, 0.5), () => {
    text('thật', x0 - 20, 302, {size: 22, weight: 700, color: COL.mute, align: 'right'});
    HMM.row(x0, 280, TR, {w});
    text('từng frame', x0 - 20, 392, {size: 22, weight: 700, color: COL.frame, align: 'right'});
    HMM.row(x0, 370, PFN, {w, truth: TR, upto: P(t, s + 0.5, 1)});
    fade(G, P(t, s + 1.5, 0.3), () => text(`sai ${errs(PFN)}`, x0 + 40 * w + 12, 392, {size: 26, weight: 700, color: COL.hl}));
  });
  fade(G, P(t, s + 2.2, 0.5), () => {
    text('Viterbi', x0 - 20, 482, {size: 22, weight: 700, color: COL.ok, align: 'right'});
    HMM.row(x0, 460, VTN, {w, truth: TR, upto: P(t, s + 2.4, 1)});
    fade(G, P(t, s + 3.4, 0.3), () => text(`sai ${errs(VTN)}`, x0 + 40 * w + 12, 482, {size: 26, weight: 700, color: COL.hl}));
  });
  fade(G, P(t, s + d * 0.55, 0.5), () => {
    card(330, 580, 600, 150, {stroke: COL.ok});
    text('Viterbi: sai ở ranh giới', 370, 630, {size: 28, weight: 700, color: COL.ok});
    text('lệch vài frame, vẫn đúng thứ tự', 370, 685, {size: 24, color: COL.mute});
    card(990, 580, 600, 150, {stroke: COL.hl});
    text('từng frame: sai rải rác', 1030, 630, {size: 28, weight: 700, color: COL.hl});
    text('nhảy qua lại khắp nơi', 1030, 685, {size: 24, color: COL.mute});
  });
}

function shotCost(G, t) {
  const s = S('cost'), d = D('cost');
  heading('Chi phí: quy hoạch động');
  fade(G, P(t, s + 0.3, 0.5), () => {
    card(300, 260, 600, 220, {stroke: COL.hl});
    text('thử mọi đường', 340, 320, {size: 26, color: COL.mute});
    text('741 đường × 40 frame', 340, 380, {size: 34, weight: 700, color: COL.hl});
    text('câu thật: ≈ 10⁴⁰ đường', 340, 435, {size: 26, color: COL.hl});
    card(1020, 260, 600, 220, {stroke: COL.ok});
    text('Viterbi', 1060, 320, {size: 26, color: COL.mute});
    text('3 × 40 = 120 ô', 1060, 380, {size: 34, weight: 700, color: COL.ok});
    text('mỗi ô so 2 số', 1060, 435, {size: 26, color: COL.ok});
  });
  fade(G, P(t, s + d * 0.35, 0.5), () => {
    card(300, 540, 1320, 110, {stroke: COL.acc});
    text('tính từng ô, giữ kết quả để dùng tiếp: quy hoạch động (dynamic programming)', 960, 595, {size: 28, weight: 700, color: COL.acc, align: 'center'});
  });
  fade(G, P(t, s + d * 0.7, 0.5), () => {
    text('làm được nhờ giả định Markov: ô (t, s) chỉ cần cột t − 1', 960, 720, {size: 26, color: COL.mute, align: 'center'});
  });
}

function shotAlign(G, t) {
  const s = S('align'), d = D('align');
  heading('Ứng dụng');
  fade(G, P(t, s + 0.3, 0.5), () => {
    card(160, 240, 780, 520, {stroke: COL.acc});
    text('đã biết câu chữ: "mai"', 200, 300, {size: 28, weight: 700, color: COL.acc});
    text('căn chỉnh cưỡng bức (forced alignment)', 200, 350, {size: 24, color: COL.mute});
    HMM.row(200, 420, VT.path, {w: 17, h: 34, size: 13});
    [[0, 10, '0–100 ms'], [10, 28, '100–280 ms'], [28, 40, '280–400 ms']].forEach(([a, b, l], k) => {
      line(200 + a * 17, 470, 200 + b * 17 - 3, 470, HMM.stateCol(k), 3);
      text(`${HMM.STATES[k]}`, 200 + (a + b) / 2 * 17, 500, {size: 22, weight: 700, color: HMM.stateCol(k), align: 'center'});
      text(l, 200 + (a + b) / 2 * 17, 530, {size: 18, color: COL.mute, align: 'center'});
    });
    text('dùng để gán nhãn dữ liệu, đo thời lượng âm', 200, 620, {size: 24, maxW: 700});
  });
  fade(G, P(t, s + d * 0.55, 0.5), () => {
    card(980, 240, 780, 520, {stroke: COL.frame});
    text('chưa biết câu chữ', 1020, 300, {size: 28, weight: 700, color: COL.frame});
    text('giải mã (decoding)', 1020, 350, {size: 24, color: COL.mute});
    [['mai', true], ['ma', false], ['mi', false], ['ami', false]].forEach(([w, on], j) => {
      const y = 410 + j * 70;
      rrect(1020, y, 260, 52, 10, on ? COL.okSoft || '#e8f3ec' : COL.soft, on ? COL.ok : COL.line2, on ? 3 : 1.5);
      text(`HMM "${w}"`, 1150, y + 26, {size: 24, weight: on ? 700 : 400, color: on ? COL.ok : COL.mute, align: 'center'});
    });
    text('Viterbi trên lưới của mọi từ', 1320, 500, {size: 24, maxW: 400});
    text('→ đường tốt nhất đi qua "mai"', 1320, 580, {size: 24, weight: 700, color: COL.ok, maxW: 400});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['mỗi ô giữ đường tốt nhất (max), nhớ mình đến từ đâu'],
   ['tới ô cuối, lần ngược: ra cách chia tốt nhất'],
   ['sửa được frame lẻ; nhiễu nhiều thì chỉ lệch ranh giới'],
   ['chi phí nhỏ nhờ giả định Markov']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.6, 0.6), () => {
      text('✓', 400, 290 + j * 84, {size: 34, weight: 700, color: COL.ok});
      text(a, 450, 290 + j * 84, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 760, 680, 'Phần 5: Forward và Baum-Welch  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 4', [
  ['lưới trạng thái × frame', 'trellis', 'mỗi ô: một trạng thái tại một frame'],
  ['tìm đường tốt nhất', 'Viterbi algorithm', 'max ở mỗi ô, rồi lần ngược'],
  ['lần ngược', 'backtracking (backpointer)', 'mỗi ô nhớ ô trước nó'],
  ['tính từng ô, giữ kết quả', 'dynamic programming', 'quy hoạch động'],
  ['chia frame khi biết câu chữ', 'forced alignment', 'căn chỉnh cưỡng bức'],
  ['tìm câu chữ', 'decoding', 'giải mã'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'trellis', to: 'count', draw: shotGrid},
    {from: 'idea', to: 'idea', draw: shotIdea},
    {from: 'formula', to: 'formula', draw: shotFormula},
    {from: 'fill', to: 'back', draw: shotFill},
    {from: 'why', to: 'why', draw: shotWhy},
    {from: 'noise', to: 'noise', draw: shotNoise},
    {from: 'cost', to: 'cost', draw: shotCost},
    {from: 'align', to: 'align', draw: shotAlign},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/hmm-4-viterbi.wav');
</script>
</body>
</html>
