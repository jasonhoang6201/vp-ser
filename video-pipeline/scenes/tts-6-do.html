<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TTS 6: Đo chất lượng</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/tts-6-do.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Khung 3 khối', '3 Pha', '4 Griffin-Lim', '5 Vocoder nơ-ron', '6 Đo chất lượng'];

/* ---------- shots ---------- */

const shotIntro = UI.introShot('TTS và vocoder', 'Phần 6/6: đo chất lượng giọng tổng hợp', 5, PARTS);

function shotWhy(G, t) {
  const s = S('why'), d = D('why');
  heading('TTS không có "câu đúng" để đếm lỗi');
  fade(G, P(t, s + 0.3, 0.5), () => {
    text('cùng một câu, nhiều cách đọc đúng', 960, 300, {size: 30, align: 'center'});
  });
  [['tự nhiên?', COL.ok], ['rõ?', COL.acc], ['giống giọng mẫu?', COL.i]].forEach(([l, c], j) =>
    fade(G, P(t, s + d * 0.4 + j * 0.6, 0.5), () => { const xs = UI.chipXs(G, ['tự nhiên?', 'rõ?', 'giống giọng mẫu?'], {size: 34, weight: 700}, 80); chip(G, xs[j], 420, l, {size: 34, weight: 700, color: c, stroke: c}); }));
}

function shotMos(G, t) {
  const sm = S('mos'), dm = D('mos'), s2 = S('mos2'), d2 = D('mos2');
  heading('MOS (Mean Opinion Score)');
  const scores = [[5, 'rất tự nhiên'], [4, 'tốt'], [3, 'khá'], [2, 'kém'], [1, 'rất tệ']];
  fade(G, P(t, sm + 0.3, 0.5), () => {
    scores.forEach(([v, l], j) => {
      rrect(300, 260 + j * 80, 80, 60, 10, COL.accSoft, COL.acc, 2);
      text(String(v), 340, 290 + j * 80, {size: 30, weight: 700, color: COL.acc, align: 'center'});
      text(l, 400, 290 + j * 80, {size: 26});
    });
    text('nhiều người nghe chấm, lấy trung bình', 340, 700, {size: 24, color: COL.mute});
  });
  fade(G, P(t, s2 + 0.3, 0.5), () => {
    const B = {x: 900, y: 280, h: 360};
    [['giọng thu thật', 4.5, COL.ok], ['hệ A', 4.1, COL.acc], ['hệ B', 3.6, COL.i]].forEach(([l, v, c], j) => {
      const h = (v - 1) / 4 * B.h, x = B.x + j * 260;
      rrect(x, B.y + B.h - h, 160, h, 8, c + 'cc');
      line(x + 80, B.y + B.h - h - 22, x + 80, B.y + B.h - h + 22, COL.ink, 2);
      text(String(v).replace('.', ','), x + 80, B.y + B.h - h - 40, {size: 28, weight: 700, color: c, align: 'center'});
      text(l, x + 80, B.y + B.h + 30, {size: 24, weight: 700, align: 'center'});
    });
    text('cùng thí nghiệm, kèm khoảng tin cậy (số minh họa)', 1250, 720, {size: 22, color: COL.mute, align: 'center'});
  });
}

function shotCer(G, t) {
  const sc = S('cer'), dc = D('cer'), s2 = S('cer2');
  heading('CER / WER qua một hệ ASR');
  fade(G, P(t, sc + 0.3, 0.5), () => {
    chip(G, 240, 320, 'câu cần đọc', {size: 28, weight: 700});
    arrow(450, 346, 520, 346, COL.mute, 3);
    chip(G, 530, 320, 'TTS', HOT);
    arrow(640, 346, 710, 346, COL.mute, 3);
    chip(G, 720, 320, 'ASR nghe lại', {size: 28, weight: 700, color: COL.acc, stroke: COL.acc});
    arrow(950, 346, 1020, 346, COL.mute, 3);
    chip(G, 1030, 320, 'so với câu cần đọc → CER', {size: 28, weight: 700, color: COL.ok, stroke: COL.ok});
    text('đo độ rõ; bắt lỗi bỏ chữ, lặp chữ', 960, 450, {size: 28, align: 'center'});
  });
  fade(G, P(t, s2 + 0.3, 0.5), () => {
    card(460, 540, 1000, 160, {stroke: COL.frame});
    text('chính các clip này: lời đọc VieNeu-TTS → Whisper nghe lại', 960, 595, {size: 26, weight: 700, color: COL.frame, align: 'center'});
    text('tìm đoạn đọc sai để đọc lại', 960, 645, {size: 24, color: COL.mute, align: 'center'});
  });
}

function shotSpk(G, t) {
  const s = S('spk'), d = D('spk');
  heading('Độ giống người nói');
  fade(G, P(t, s + 0.3, 0.5), () => {
    const cx = 700, cy = 520, g = Clip.g;
    arrow(cx, cy, cx + 300, cy - 180, COL.ok, 4, 16);
    arrow(cx, cy, cx + 320, cy - 120, COL.i, 4, 16);
    text('giọng mẫu', cx + 310, cy - 200, {size: 24, weight: 700, color: COL.ok});
    text('giọng tổng hợp', cx + 330, cy - 110, {size: 24, weight: 700, color: COL.i});
    g.beginPath(); g.arc(cx, cy, 90, -Math.atan2(180, 300), -Math.atan2(120, 320), false); g.strokeStyle = COL.frame; g.lineWidth = 3; g.stroke();
    text('góc nhỏ = giống', cx + 120, cy - 30, {size: 22, weight: 700, color: COL.frame});
  });
  fade(G, P(t, s + d * 0.4, 0.5), () => {
    card(1260, 300, 480, 200, {stroke: COL.i});
    text('speaker embedding', 1290, 350, {size: 26, weight: 700, color: COL.i});
    text('cosine giữa hai vector', 1290, 400, {size: 24});
    text('dùng khi nhân bản giọng (trang 17)', 1290, 450, {size: 22, color: COL.mute});
  });
}

function shotPage(G, t) {
  const s = S('page');
  heading('Tóm tắt trang TTS và vocoder');
  [['xử lý văn bản', COL.i], ['mô hình âm học: âm vị → Mel', COL.acc], ['vocoder: Mel → sóng', COL.frame]].forEach(([l, c], j) =>
    fade(G, P(t, s + 0.3 + j * 0.8, 0.5), () => { const x = 220 + j * 520; rrect(x, 300, 460, 100, 16, c + '18', c, 3); text(l, x + 230, 350, {size: 26, weight: 700, color: c, align: 'center'}); if (j < 2) arrow(x + 466, 350, x + 514, 350, COL.mute, 3); }));
  fade(G, P(t, s + 3, 0.5), () => {
    text('Mel không có pha · Griffin-Lim rè · HiFi-GAN tạo pha tốt', 960, 480, {size: 30, weight: 700, align: 'center'});
    text('đo: MOS · CER qua ASR · độ giống người nói', 960, 550, {size: 28, color: COL.mute, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['MOS: độ tự nhiên', COL.ok], ['CER qua ASR: độ rõ', COL.acc], ['cosine speaker embedding: độ giống', COL.i]].forEach(([a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.6, 0.6), () => {
      text('✓', 480, 300 + j * 84, {size: 34, weight: 700, color: c});
      text(a, 530, 300 + j * 84, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 800, 640, 'Trang sau: Tacotron 2  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 6', [
  ['điểm nghe trung bình 1 đến 5', 'MOS (Mean Opinion Score)', 'so với giọng thật'],
  ['độ rõ qua nhận dạng', 'CER / WER qua ASR (intelligibility)', 'bắt bỏ chữ, lặp chữ'],
  ['vector đặc trưng người nói', 'speaker embedding', 'cosine để so'],
  ['khoảng tin cậy', 'confidence interval (CI)', 'báo kèm MOS'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'why', to: 'why', draw: shotWhy},
    {from: 'mos', to: 'mos2', draw: shotMos},
    {from: 'cer', to: 'cer2', draw: shotCer},
    {from: 'spk', to: 'spk', draw: shotSpk},
    {from: 'page', to: 'page', draw: shotPage},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/tts-6-do.wav');
</script>
</body>
</html>
