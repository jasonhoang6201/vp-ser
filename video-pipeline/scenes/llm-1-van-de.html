<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Audio-LLM · 1: Vấn đề</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/llm-1-van-de.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Ba khối, ba giai đoạn', '3 Bao nhiêu token', '4 Đọc câu trả lời'];
const PAINS = [
  ['p1', 'mỗi việc mới cần thêm đầu ra và dữ liệu có nhãn', 'thêm "đoán tuổi người nói" là phải huấn luyện lại'],
  ['p2', 'chỉ ra nhãn, không ra lý do', '"anger" mà không biết vì giọng hay vì lời'],
  ['p3', 'không có hiểu biết chung về thế giới', 'không biết "đậu đại học" thường là tin vui'],
];

/* ---------- shots ---------- */

const shotIntro = UI.introShot('Audio-LLM', 'Phần 1/4: mỗi việc một đầu ra, không giải thích được', 0, PARTS);

function shotPlace(G, t) {
  const s = S('place'), d = D('place');
  heading('Hỏi bằng lời, trả lời bằng lời');
  fade(G, P(t, s + 0.3, 0.5), () => {
    const labels = ['Qwen2-Audio (Alibaba, 2024)', 'SALMONN', 'WavLLM'], xs = UI.chipXs(G, labels, {size: 26, weight: 700}, 30);
    labels.forEach((l, j) => chip(G, xs[j], 250, l, {size: 26, weight: 700, color: j ? COL.mute : COL.frame, stroke: j ? COL.line : COL.frame}));
  });
  fade(G, P(t, s + d * 0.35, 0.5), () => {
    chip(G, 260, 400, 'âm thanh', {size: 28, weight: 700});
    text('+', 520, 426, {size: 36, weight: 700, align: 'center'});
    card(560, 370, 900, 110, {stroke: COL.acc});
    text('"Chép lại câu này và cho biết người nói đang cảm thấy thế nào."', 1010, 425, {size: 26, weight: 700, color: COL.acc, align: 'center', maxW: 860});
  });
  fade(G, P(t, s + d * 0.7, 0.5), () => {
    arrow(960, 490, 960, 550, COL.mute, 3);
    card(460, 560, 1000, 110, {stroke: COL.ok});
    text('"Câu nói: \'Mình đậu rồi!\'. Người nói vui mừng: giọng cao, nhanh."', 960, 615, {size: 26, weight: 700, color: COL.ok, align: 'center', maxW: 960});
  });
}

function shotPain(G, t) {
  heading('Vấn đề của các mô hình trước');
  PAINS.forEach(([id, a, b], j) => fade(G, P(t, S(id) + 0.2, 0.5), () => {
    const y = 240 + j * 180, on = t >= S(id) && t < E(id) + 0.3;
    card(240, y, 1440, 150, {stroke: on ? COL.hl : COL.line, lw: on ? 3 : 2});
    text(a, 280, y + 55, {size: 32, weight: 700, color: COL.hl});
    text(b, 280, y + 110, {size: 26, color: COL.mute, maxW: 1360});
  }));
}

function shotIdea(G, t) {
  const si = S('idea'), di = D('idea'), sg = S('goal');
  heading(t < sg ? 'LLM đã có ba thứ đó, chỉ thiếu khả năng nghe âm thanh' : 'Mục tiêu');
  if (t < sg) {
    fade(G, P(t, si + 0.3, 0.5), () => {
      rrect(660, 300, 600, 160, 20, COL.accSoft, COL.acc, 3);
      text('LLM', 960, 360, {size: 40, weight: 700, color: COL.acc, align: 'center'});
      text('hiểu ngôn ngữ, thế giới · làm theo lệnh', 960, 420, {size: 24, color: COL.acc, align: 'center'});
    });
    fade(G, P(t, si + di * 0.5, 0.5), () => {
      chip(G, 300, 354, 'tai?', {size: 32, weight: 700, color: COL.hl, stroke: COL.hl});
      arrow(410, 380, 650, 380, COL.hl, 3, 14);
      text('một mô hình, nhiều việc, không thêm đầu ra', 960, 580, {size: 30, weight: 700, color: COL.ok, align: 'center'});
    });
    return;
  }
  fade(G, P(t, sg + 0.3, 0.5), () => {
    const labels = ['encoder âm thanh', 'LLM sẵn có'], xs = UI.chipXs(G, labels, {size: 32, weight: 700}, 140);
    chip(G, xs[0], 330, labels[0], {size: 32, weight: 700, color: COL.frame, stroke: COL.frame});
    arrow(xs[1] - 120, 356, xs[1] - 20, 356, COL.mute, 3);
    chip(G, xs[1], 330, labels[1], {size: 32, weight: 700, color: COL.acc, stroke: COL.acc});
    text('LLM đọc âm thanh như đọc chữ, làm theo câu lệnh bằng lời', 960, 500, {size: 30, weight: 700, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['✗', 'mỗi việc một đầu ra · không lý do · không hiểu thế giới', COL.hl], ['✓', 'LLM có sẵn cả ba, chỉ thiếu khả năng nghe âm thanh', COL.ok]].forEach(([m, a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.8, 0.6), () => {
      text(m, 340, 320 + j * 100, {size: 34, weight: 700, color: c});
      text(a, 390, 320 + j * 100, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 800, 620, 'Phần 2: cách làm  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 1', [
  ['mô hình ngôn ngữ rất lớn', 'LLM (Large Language Model)', ''],
  ['câu lệnh đưa cho mô hình', 'prompt, instruction', ''],
  ['LLM nghe được âm thanh', 'audio-LLM, speech LLM', 'Qwen2-Audio, SALMONN'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'place', to: 'place', draw: shotPlace},
    {from: 'p1', to: 'p3', draw: shotPain},
    {from: 'idea', to: 'goal', draw: shotIdea},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/llm-1-van-de.wav');
</script>
</body>
</html>
