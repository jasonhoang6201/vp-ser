<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SER từ chữ · 1: Vấn đề</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/bert-1-van-de.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Bốn thành phần', '3 Lỗi ASR'];
const PAINS = [
  ['p1', 'phủ định, mỉa mai', '"I\'m not happy" ngược nghĩa · "oh great, just great" là mỉa mai'],
  ['p2', 'học từ đầu trên IEMOCAP', 'vài nghìn câu là quá ít để học cả một ngôn ngữ'],
  ['p3', 'chữ do ASR chép', 'có lỗi; lỗi rơi vào đúng từ cảm xúc thì hỏng'],
];

/* ---------- shots ---------- */

const shotIntro = UI.introShot('SER từ chữ: BERT, RoBERTa', 'Phần 1/3: đếm từ cảm xúc là chưa đủ', 0, PARTS);

function shotLex(G, t) {
  const sp = S('place'), sl = S('lex'), dl = D('lex');
  heading(t < sl ? 'Giọng: giận ≈ vui · Chữ: phân biệt tốt' : 'Cách đơn giản: tra từ khóa');
  if (t < sl) {
    fade(G, P(t, sp + 0.3, 0.5), () => {
      card(260, 300, 620, 240, {stroke: COL.frame});
      text('giọng nói', 570, 360, {size: 30, weight: 700, color: COL.frame, align: 'center'});
      text('giận ≈ vui: to, cao, nhanh', 570, 440, {size: 26, align: 'center'});
      card(1040, 300, 620, 240, {stroke: COL.acc, lw: 3});
      text('câu chữ', 1350, 360, {size: 30, weight: 700, color: COL.acc, align: 'center'});
      text('"tuyệt quá" ≠ "đồ tệ hại"', 1350, 440, {size: 26, align: 'center'});
    });
    return;
  }
  fade(G, P(t, sl + 0.3, 0.5), () => {
    [['happy, love', 'vui', COL.ok], ['hate', 'giận', COL.hl]].forEach(([w, l, c], j) => {
      const y = 320 + j * 140;
      chip(G, 500, y, w, {size: 30, weight: 700});
      arrow(780, y + 26, 940, y + 26, COL.mute, 3);
      fade(G, P(t, sl + dl * 0.3 + j * 0.8, 0.4), () => chip(G, 960, y, l, {size: 30, weight: 700, color: c, stroke: c}));
    });
  });
}

function shotPain(G, t) {
  heading('Ba vấn đề');
  PAINS.forEach(([id, a, b], j) => fade(G, P(t, S(id) + 0.2, 0.5), () => {
    const y = 240 + j * 180, on = t >= S(id) && t < E(id) + 0.3;
    card(240, y, 1440, 150, {stroke: on ? COL.hl : COL.line, lw: on ? 3 : 2});
    text(a, 280, y + 55, {size: 32, weight: 700, color: COL.hl});
    text(b, 280, y + 110, {size: 26, color: COL.mute, maxW: 1360});
  }));
}

function shotGoal(G, t) {
  const s = S('goal'), d = D('goal');
  heading('Mục tiêu');
  fade(G, P(t, s + 0.3, 0.5), () => {
    chip(G, 300, 330, 'rất nhiều văn bản', {size: 28, weight: 700});
    arrow(600, 356, 690, 356, COL.mute, 3);
    rrect(710, 290, 480, 130, 16, COL.accSoft, COL.acc, 3);
    text('mô hình học sẵn ngôn ngữ', 950, 340, {size: 28, weight: 700, color: COL.acc, align: 'center'});
    text('hiểu phủ định, ngữ cảnh', 950, 385, {size: 22, color: COL.acc, align: 'center'});
    arrow(1200, 356, 1290, 356, COL.mute, 3);
    chip(G, 1310, 330, '+ ít dữ liệu cảm xúc', {size: 28, weight: 700, color: COL.ok, stroke: COL.ok});
  });
  fade(G, P(t, s + d * 0.65, 0.5), () => text('và hiểu lỗi ASR hại tới đâu (phần 3)', 960, 560, {size: 30, weight: 700, color: COL.frame, align: 'center'}));
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['đếm từ không hiểu phủ định, mỉa mai'], ['dữ liệu cảm xúc ít'], ['chữ từ ASR có lỗi']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.4, 0.6), () => {
      text('✗', 600, 300 + j * 90, {size: 34, weight: 700, color: COL.hl});
      text(a, 650, 300 + j * 90, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 780, 640, 'Phần 2: bốn thành phần của BERT  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 1', [
  ['tra từ trong danh sách cảm xúc', 'lexicon-based', 'không hiểu ngữ cảnh'],
  ['mỉa mai', 'sarcasm', ''],
  ['câu người nói thật / máy chép', 'ground-truth / ASR transcript', ''],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'place', to: 'lex', draw: shotLex},
    {from: 'p1', to: 'p3', draw: shotPain},
    {from: 'goal', to: 'goal', draw: shotGoal},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/bert-1-van-de.wav');
</script>
</body>
</html>
