<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TTS 4: Griffin-Lim</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/dsp.js"></script>
<script src="../lib/tts.js"></script>
<script src="../build/tts-4-griffin-lim.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp, axes} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Khung 3 khối', '3 Pha', '4 Griffin-Lim', '5 Vocoder nơ-ron', '6 Đo chất lượng'];
const ALL = Array.from({length: 100}, (_, i) => i + 1), GL = TTS.griffinLim(ALL);
const pct = v => `${Math.round(v * 100)}%`;

function cycle(t, hl) {
  const steps = [['1', 'dựng sóng: độ lớn đã biết + pha hiện tại'], ['2', 'FFT từng frame của sóng vừa dựng'], ['3', 'giữ pha mới, thay lại độ lớn đã biết']];
  steps.forEach(([n, l], j) => {
    const x = 220 + j * 520, on = hl === j;
    rrect(x, 300, 460, 150, 16, on ? COL.frameSoft : COL.card, on ? COL.frame : COL.line2, on ? 3 : 1.5);
    text(n, x + 40, 375, {size: 48, weight: 700, color: on ? COL.frame : COL.line2, align: 'center'});
    text(l, x + 80, 375, {size: 24, weight: on ? 700 : 400, maxW: 360});
    if (j < 2) arrow(x + 468, 375, x + 512, 375, COL.mute, 3);
  });
  const g = Clip.g;
  g.beginPath(); g.moveTo(1500, 460); g.quadraticCurveTo(960, 600, 440, 460); g.strokeStyle = COL.mute; g.lineWidth = 2.5; g.setLineDash([8, 6]); g.stroke(); g.setLineDash([]);
  arrow(452, 466, 440, 460, COL.mute, 2.5);
  text('lặp lại', 960, 560, {size: 24, color: COL.mute, align: 'center'});
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('TTS và vocoder', 'Phần 4/6: Griffin-Lim, đoán pha bằng cách lặp', 3, PARTS);

function shotIdea(G, t) {
  const si = S('idea'), s1 = S('s1'), s2 = S('s2'), s3 = S('s3');
  heading('Griffin-Lim (1984): không cần học');
  fade(G, P(t, si + 0.3, 0.5), () => {
    if (t < s1) {
      text('biết: độ lớn   ·   không biết: pha', 960, 320, {size: 34, weight: 700, align: 'center'});
      text('bắt đầu từ pha ngẫu nhiên, rồi lặp ba bước', 960, 400, {size: 28, color: COL.frame, align: 'center'});
    } else cycle(t, t >= s3 ? 2 : t >= s2 ? 1 : 0);
  });
}

function shotCurve(G, t) {
  const sc = S('curve'), dc = D('curve'), ss = S('slow'), ds = D('slow');
  heading('Sai lệch độ lớn theo vòng lặp');
  const B = {x: 300, y: 250, w: 1000, h: 420};
  const {X, Y} = axes(B, [0, 100], [0, 0.65], {gridY: [0, 0.2, 0.4, 0.6], fmtY: v => pct(v), ticksX: [0, 10, 20, 50, 100], xlabel: 'vòng lặp', ylabel: 'sai lệch'});
  const upto = t < ss ? 5 * P(t, sc + 0.5, dc * 0.7) : 5 + 95 * P(t, ss + 0.3, ds * 0.7);
  const its = Array.from({length: Math.floor(upto) + 1}, (_, i) => i);
  poly(its.map(X), its.map(i => Y(GL[i].err)), COL.acc, 4);
  const marks = t < ss ? [0, 1, 5] : [0, 1, 5, 10, 30, 100];
  marks.filter(i => i <= upto).forEach(i => {
    Clip.g.beginPath(); Clip.g.arc(X(i), Y(GL[i].err), 8, 0, Math.PI * 2); Clip.g.fillStyle = COL.frame; Clip.g.fill();
    text(pct(GL[i].err), X(i) + (i === 0 ? 14 : 10), Y(GL[i].err) - 20, {size: 22, weight: 700, color: COL.frame});
  });
  fade(G, P(t, ss + ds * 0.5, 0.5), () => {
    card(1360, 300, 380, 220, {stroke: COL.hl});
    text('trong dần', 1390, 350, {size: 26, weight: 700, color: COL.ok});
    text('nhưng vẫn rè,', 1390, 410, {size: 26, weight: 700, color: COL.hl});
    text('tiếng "kim loại"', 1390, 460, {size: 26, weight: 700, color: COL.hl});
  });
}

function shotMel(G, t) {
  const sm = S('mel'), st = S('taco'), dt = D('taco');
  heading(t < st ? 'Ở đây còn đủ 257 bin; với Mel còn tệ hơn' : 'Tacotron (2017) bản đầu dùng Griffin-Lim');
  fade(G, P(t, sm + 0.3, 0.5), () => {
    for (let k = 0; k < 64; k++) rrect(300 + k * 9, 300, 7, 260, 1, COL.acc + '66');
    text('257 bin: độ lớn đầy đủ', 590, 600, {size: 24, weight: 700, color: COL.acc, align: 'center'});
    for (let k = 0; k < 20; k++) rrect(1100 + k * 26, 300, 22, 260, 2, COL.frame + '88');
    text('80 số Mel: đoán ngược 257 bin trước', 1360, 600, {size: 24, weight: 700, color: COL.frame, align: 'center'});
    text('đã mất chi tiết', 1360, 640, {size: 22, color: COL.hl, align: 'center'});
  });
  fade(G, P(t, st + 0.3, 0.5), () => {
    card(460, 690, 1000, 110, {stroke: COL.frame});
    text('chất lượng bị giới hạn ở bước này → cần vocoder học từ dữ liệu', 960, 745, {size: 26, weight: 700, color: COL.frame, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['lặp: dựng sóng, lấy pha mới, thay lại độ lớn'], [`nhanh lúc đầu: ${pct(GL[0].err)} → ${pct(GL[5].err)} sau 5 vòng`], [`chậm về sau: ${pct(GL[100].err)} ở vòng 100`], ['vẫn rè: cần vocoder học từ dữ liệu']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.5, 0.6), () => {
      text(j < 3 ? '·' : '✗', 440, 290 + j * 84, {size: 34, weight: 700, color: j < 3 ? COL.acc : COL.hl});
      text(a, 490, 290 + j * 84, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 800, 680, 'Phần 5: vocoder nơ-ron  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 4', [
  ['đoán pha bằng cách lặp', 'Griffin-Lim (1984)', 'không cần học'],
  ['dựng sóng từ phổ', 'ISTFT', 'độ lớn + pha'],
  ['độ lệch giữa phổ dựng và phổ biết', 'spectral convergence', 'giảm dần theo vòng'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'idea', to: 's3', draw: shotIdea},
    {from: 'curve', to: 'slow', draw: shotCurve},
    {from: 'mel', to: 'taco', draw: shotMel},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/tts-4-griffin-lim.wav');
</script>
</body>
</html>
