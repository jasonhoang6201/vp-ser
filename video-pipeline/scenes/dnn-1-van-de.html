<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>DNN-HMM 1: Vấn đề</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/hmm.js"></script>
<script src="../build/dnn-1-van-de.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Mạng trong khung HMM', '3 Một nơ-ron', '4 Nhiều lớp', '5 Ghép vào HMM'];
const PA = GMM.cloud(31, [[-0.9, 0.2, 0.45, 0.7, 0.3, 80]]), PE = GMM.cloud(32, [[0.9, -0.1, 0.5, 0.6, -0.2, 80]]);

function cloudBox(B, o = {}) {
  const X = v => B.x + (v + 2.4) / 4.8 * B.w, Y = v => B.y + B.h - (v + 2) / 4 * B.h, g = Clip.g;
  rrect(B.x, B.y, B.w, B.h, 12, COL.card, COL.line, 2);
  [[PA, COL.acc], [PE, COL.frame]].forEach(([pts, c]) => pts.forEach(([x, y]) => {
    if (x < -2.4 || x > 2.4 || y < -2 || y > 2) return;
    g.beginPath(); g.arc(X(x), Y(y), 4, 0, Math.PI * 2); g.fillStyle = c + 'aa'; g.fill();
  }));
  if (o.ellipses) [[-0.9, 0.2, 0.9, 1.4, COL.acc], [0.9, -0.1, 1.0, 1.2, COL.frame]].forEach(([mx, my, rx, ry, c]) => {
    g.beginPath(); g.ellipse(X(mx), Y(my), rx / 4.8 * B.w, ry / 4 * B.h, 0, 0, Math.PI * 2); g.strokeStyle = c; g.lineWidth = 3; g.stroke();
  });
  if (o.boundary) { line(X(0.05) + 30, B.y + 10, X(0.05) - 30, B.y + B.h - 10, COL.ink, 4, [10, 6]); }
  text('"a"', X(-0.9), B.y + 30, {size: 26, weight: 700, color: COL.acc, align: 'center'});
  text('"e"', X(0.9), B.y + 30, {size: 26, weight: 700, color: COL.frame, align: 'center'});
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('DNN-HMM', 'Phần 1/5: GMM chấm điểm còn yếu ở đâu?', 0, PARTS);

function shotKeep(G, t) {
  const s = S('keep'), d = D('keep');
  heading('Giữ nguyên hệ, chỉ thay một thành phần');
  const items = [['MFCC / log-Mel', 0], ['GMM chấm frame', 1], ['HMM', 0], ['từ điển', 0], ['LM', 0], ['decoder', 0]];
  fade(G, P(t, s + 0.3, 0.5), () => {
    let x = 220;
    items.forEach(([l, hot], j) => {
      const on = hot && t > s + d * 0.5;
      const w = chip(G, x, 340, l, on ? {fill: COL.hlSoft, stroke: COL.hl, color: COL.hl, weight: 700, size: 28} : {size: 28});
      if (j < items.length - 1) arrow(x + w + 8, 366, x + w + 40, 366, COL.mute, 2.5, 10);
      if (on) {
        arrow(x + w / 2, 410, x + w / 2, 490, COL.hl, 3);
        text('chỉ thay phần này', x + w / 2, 530, {size: 26, weight: 700, color: COL.hl, align: 'center'});
        text('"frame này giống trạng thái nào?"', x + w / 2, 575, {size: 24, color: COL.mute, align: 'center'});
      }
      x += w + 48;
    });
  });
}

function shotGen(G, t) {
  const sg = S('gen'), dg = D('gen'), s2 = S('gen2'), d2 = D('gen2');
  heading(t < s2 ? 'Vấn đề 1: GMM chỉ học mô tả âm của mình' : 'Mô hình sinh và mô hình phân biệt');
  fade(G, P(t, sg + 0.3, 0.5), () => {
    cloudBox({x: 220, y: 230, w: 640, h: 480}, {ellipses: t > sg + 1.5});
    text('GMM "a" chỉ thấy điểm xanh,', 540, 760, {size: 24, align: 'center'});
    text('GMM "e" chỉ thấy điểm cam', 540, 795, {size: 24, align: 'center'});
  });
  fade(G, P(t, sg + dg * 0.55, 0.5), () => {
    cloudBox({x: 1060, y: 230, w: 640, h: 480}, {boundary: true});
    text('việc ta cần: phân biệt "a" với "e"', 1380, 760, {size: 24, weight: 700, color: COL.ok, align: 'center'});
  });
  fade(G, P(t, s2 + 0.3, 0.5), () => {
    chip(G, 370, 830, 'generative: mô tả dữ liệu', {fill: COL.accSoft, stroke: COL.acc, color: COL.acc, weight: 700});
    fade(G, P(t, s2 + d2 * 0.35, 0.5), () => chip(G, 1200, 830, 'discriminative: học ranh giới', {fill: '#e8f3ec', stroke: COL.ok, color: COL.ok, weight: 700}));
  });
}

function shotCtx(G, t) {
  const s = S('ctx'), d = D('ctx');
  heading('Vấn đề 2: khó nhìn nhiều frame cùng lúc');
  fade(G, P(t, s + 0.3, 0.5), () => {
    for (let k = 0; k < 11; k++) {
      const on = k === 5;
      rrect(240 + k * 44, 260, 38, 300, 6, on ? COL.frameSoft : COL.accSoft, on ? COL.frame : COL.acc, on ? 3 : 1.5);
    }
    text('frame đang xét', 240 + 5 * 44 + 19, 590, {size: 22, weight: 700, color: COL.frame, align: 'center'});
    text('11 frame × 40 số log-Mel', 480, 230, {size: 24, weight: 700, align: 'center'});
  });
  fade(G, P(t, s + d * 0.35, 0.5), () => {
    arrow(740, 410, 840, 410, COL.mute, 3);
    text('= 440 chiều', 960, 410, {size: 40, weight: 700, color: COL.acc, align: 'center'});
  });
  fade(G, P(t, s + d * 0.6, 0.5), () => {
    const x0 = 1200, y0 = 250, n = 22, c = 320 / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (j >= i) rrect(x0 + j * c, y0 + i * c, c - 1, c - 1, 1, COL.hl + (i === j ? 'cc' : '44'));
    text('covariance đầy đủ 440 × 440', x0 + 160, y0 + 360, {size: 22, color: COL.mute, align: 'center'});
    text('≈ 97 000 số cho mỗi Gaussian', x0 + 160, y0 + 400, {size: 28, weight: 700, color: COL.hl, align: 'center'});
  });
}

function shotMfcc(G, t) {
  const s = S('mfcc'), d = D('mfcc');
  heading('Vấn đề 3: phải dùng MFCC');
  fade(G, P(t, s + 0.3, 0.5), () => {
    let x = 330;
    [['40 log-Mel', {}], ['DCT', {}], ['cắt còn 13', {fill: COL.hlSoft, stroke: COL.hl, color: COL.hl, weight: 700}]].forEach(([l, o], j) => {
      const w = chip(G, x, 300, l, {size: 30, ...o});
      if (j < 2) arrow(x + w + 10, 326, x + w + 80, 326, COL.mute, 3);
      x += w + 90;
    });
  });
  fade(G, P(t, s + d * 0.3, 0.5), () => {
    card(330, 430, 600, 180, {stroke: COL.acc});
    text('vì GMM dùng covariance đường chéo', 360, 485, {size: 26, weight: 700, color: COL.acc});
    text('cần các số ít tương quan', 360, 535, {size: 24, color: COL.mute});
  });
  fade(G, P(t, s + d * 0.6, 0.5), () => {
    card(990, 430, 600, 180, {stroke: COL.hl});
    text('làm để chiều GMM', 1020, 485, {size: 26, weight: 700, color: COL.hl});
    text('và làm mất bớt thông tin', 1020, 535, {size: 24, color: COL.mute});
  });
}

function shotBound(G, t) {
  const s = S('bound'), d = D('bound');
  heading('Vấn đề 4: ranh giới rối');
  const B = {x: 560, y: 220, w: 800, h: 520};
  fade(G, P(t, s + 0.3, 0.6), () => {
    if (!shotBound.cv) {
      const r = GMM.rng(77), cs = Array.from({length: 46}, () => [r(), r(), Math.floor(r() * 6)]);
      const cv = document.createElement('canvas'); cv.width = B.w; cv.height = B.h;
      const g = cv.getContext('2d'), pal = [COL.acc, COL.frame, COL.ok, COL.i, COL.hl, '#8a7f5a'];
      for (let px = 0; px < B.w; px += 6) for (let py = 0; py < B.h; py += 6) {
        const u = px / B.w + 0.04 * Math.sin(py / 23), v = py / B.h + 0.04 * Math.sin(px / 31);
        let best = 0, bd = 9;
        cs.forEach(([cx, cy], k) => { const dd = (cx - u) ** 2 + (cy - v) ** 2; if (dd < bd) { bd = dd; best = k; } });
        g.fillStyle = pal[cs[best][2]] + '44'; g.fillRect(px, py, 6, 6);
      }
      shotBound.cv = cv;
    }
    Clip.g.drawImage(shotBound.cv, B.x, B.y);
    rrect(B.x, B.y, B.w, B.h, 4, null, COL.line2, 2);
  });
  fade(G, P(t, s + d * 0.45, 0.5), () => {
    text('vài nghìn senone', 360, 400, {size: 30, weight: 700, align: 'center'});
    text('nằm chen nhau', 360, 445, {size: 26, color: COL.mute, align: 'center'});
    text('khó tả bằng', 1560, 400, {size: 26, color: COL.mute, align: 'center'});
    text('vài phân phối Gauss', 1560, 445, {size: 30, weight: 700, color: COL.hl, align: 'center'});
  });
}

function shotGoal(G, t) {
  const sg = S('goal'), dg = D('goal'), sa = S('answer'), da = D('answer');
  heading(t < sa ? 'Mục tiêu' : 'Câu trả lời: mạng nơ-ron sâu (DNN)');
  [['học thẳng việc phân biệt các trạng thái', 'vấn đề 1, 4'], ['nhìn nhiều frame một lúc', 'vấn đề 2'], ['dùng log-Mel đầy đủ thay MFCC', 'vấn đề 3']].forEach(([a, b], j) =>
    fade(G, P(t, sg + 0.5 + j * dg * 0.2, 0.5), () => {
      text('✓', 360, 280 + j * 76, {size: 34, weight: 700, color: COL.ok});
      text(a, 410, 280 + j * 76, {size: 32});
      text(b, 1500, 280 + j * 76, {size: 24, color: COL.mute});
    }));
  fade(G, P(t, sa + 0.3, 0.5), () => {
    [0, 1, 2].forEach(k => { HMM.stateBox(560 + k * 300, 560, k, {loop: true}); if (k < 2) arrow(690 + k * 300, 605, 850 + k * 300, 605, COL.mute, 3); });
    text('HMM: lo thời gian, thứ tự', 1500, 605, {size: 24, weight: 700, color: COL.mute});
  });
  fade(G, P(t, sa + da * 0.4, 0.5), () => {
    rrect(560, 720, 720, 80, 14, COL.frameSoft, COL.frame, 3);
    text('DNN chấm điểm cho mọi trạng thái', 920, 760, {size: 28, weight: 700, color: COL.frame, align: 'center'});
    [0, 1, 2].forEach(k => arrow(620 + k * 300, 716, 620 + k * 300, 656, COL.frame, 2.5));
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại: bốn vấn đề của GMM');
  [['không học phân biệt (generative)'], ['khó nhìn nhiều frame'], ['buộc dùng MFCC'], ['khó vẽ ranh giới rối']].forEach(([a], j) =>
    fade(G, P(t, s + 0.3 + j * 1.2, 0.6), () => {
      text('✗', 560, 290 + j * 84, {size: 34, weight: 700, color: COL.hl});
      text(a, 610, 290 + j * 84, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 720, 680, 'Phần 2: DNN ghép vào HMM thế nào  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 1', [
  ['mạng nơ-ron sâu', 'DNN (Deep Neural Network)', 'nhiều lớp nơ-ron'],
  ['mô hình mô tả dữ liệu', 'generative model', 'GMM: mỗi lớp tả mình'],
  ['mô hình học ranh giới', 'discriminative model', 'DNN: học phân biệt'],
  ['nhìn các frame xung quanh', 'context window (ngữ cảnh)', '11 frame × 40 = 440 số'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'keep', to: 'keep', draw: shotKeep},
    {from: 'gen', to: 'gen2', draw: shotGen},
    {from: 'ctx', to: 'ctx', draw: shotCtx},
    {from: 'mfcc', to: 'mfcc', draw: shotMfcc},
    {from: 'bound', to: 'bound', draw: shotBound},
    {from: 'goal', to: 'answer', draw: shotGoal},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/dnn-1-van-de.wav');
</script>
</body>
</html>
