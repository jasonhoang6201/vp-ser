<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đánh giá · 4: Chênh bao nhiêu thì đáng tin</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/evalx.js"></script>
<script src="../build/eval-4-tin-cay.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Quy tắc', '3 Chọn epoch', '4 Tin cậy', '5 Rò rỉ', '6 WER'];
const f1 = v => v.toFixed(1).replace('.', ',');

// Accuracy axis 64..82 mapped to x 260..1660.
const xs = v => 260 + (v - 64) / 18 * 1400;
function axis(y) {
  line(xs(64), y, xs(82), y, COL.line2, 2);
  for (let v = 64; v <= 82; v += 2) { line(xs(v), y - 6, xs(v), y + 6, COL.line2, 2); text(`${v}`, xs(v), y + 32, {size: 20, color: COL.mute, align: 'center'}); }
}
function interval(p, h, y, c, label) {
  rrect(xs(p - h), y - 18, xs(p + h) - xs(p - h), 36, 8, c + '22', c, 2);
  line(xs(p), y - 26, xs(p), y + 26, c, 4);
  text(label, xs(p - h) - 16, y + 9, {size: 24, weight: 700, color: c, align: 'right'});
  text(`${f1(p)} ± ${f1(h)}`, xs(p + h) + 16, y + 9, {size: 22, color: c});
}

const shotIntro = UI.introShot('Đánh giá cho đúng', 'Phần 4/6: chênh bao nhiêu thì đáng tin', 3, PARTS);

function shotCI(G, t) {
  const sf = S('formula'), se = S('ex'), sd = S('diff'), sn = S('n');
  heading(t < se ? 'Khoảng tin cậy 95%' : t < sd ? '1 200 câu test, độ chính xác 72%' : t < sn ? 'B hơn A 1,5 điểm' : 'Cỡ tập test quyết định độ rộng');
  fade(G, P(t, sf + 0.3, 0.5), () => {
    text('p  ±  1,96 × √( p(1 − p) / n )', 960, 260, {size: 44, weight: 700, mono: true, align: 'center'});
    text('n: số câu test · p: độ chính xác', 960, 320, {size: 22, color: COL.mute, align: 'center'});
  });
  if (t < se) return;
  if (t < sn) {
    fade(G, P(t, se + 0.3, 0.5), () => { axis(800); interval(72, EVX.ci(1200, 0.72), 520, COL.acc, 'A'); });
    if (t >= sd) fade(G, P(t, sd + 0.3, 0.5), () => {
      interval(73.5, EVX.ci(1200, 0.735), 640, COL.frame, 'B');
      rrect(xs(73.5 - EVX.ci(1200, 0.735)), 470, xs(72 + EVX.ci(1200, 0.72)) - xs(73.5 - EVX.ci(1200, 0.735)), 220, 6, COL.hl + '18');
      text('chồng nhau: có thể chỉ là ngẫu nhiên', 960, 420, {size: 28, weight: 700, color: COL.hl, align: 'center'});
    });
    return;
  }
  fade(G, P(t, sn + 0.3, 0.5), () => {
    axis(820);
    [[300, 470, COL.hl], [1200, 590, COL.acc], [5000, 710, COL.ok]].forEach(([n, y, c], j) =>
      fade(G, P(t, sn + 0.3 + j * 1.5, 0.5), () => interval(72, EVX.ci(n, 0.72), y, c, `n = ${String(n).replace(/\B(?=(\d{3})+$)/g, ' ')}`)));
  });
}

function shotMore(G, t) {
  const su = S('ua'), ss = S('seed'), st = S('test');
  heading(t < ss ? 'Với UA: mỗi lớp ít câu hơn' : t < st ? 'Hai nguồn ngẫu nhiên' : 'So hai hệ chặt hơn');
  if (t < ss) {
    fade(G, P(t, su + 0.3, 0.5), () => {
      text('UA = trung bình độ chính xác từng lớp', 960, 300, {size: 30, weight: 700, align: 'center'});
      text('mỗi lớp chỉ có một phần của n câu → khoảng của từng lớp rộng hơn → UA dao động nhiều hơn', 960, 380, {size: 26, align: 'center', maxW: 1500});
    });
    return;
  }
  if (t < st) {
    fade(G, P(t, ss + 0.3, 0.5), () => {
      card(220, 280, 680, 280, {stroke: COL.acc});
      text('chọn câu test', 560, 350, {size: 30, weight: 700, color: COL.acc, align: 'center'});
      text('khoảng tin cậy ở trên', 560, 420, {size: 24, align: 'center'});
      text('+', 960, 440, {size: 50, weight: 700, align: 'center'});
      card(1020, 280, 680, 280, {stroke: COL.frame});
      text('seed', 1360, 350, {size: 30, weight: 700, color: COL.frame, align: 'center'});
      text('khởi tạo, thứ tự dữ liệu', 1360, 420, {size: 24, align: 'center'});
      text('đo bằng độ lệch chuẩn qua các seed', 1360, 470, {size: 22, color: COL.mute, align: 'center'});
    });
    return;
  }
  fade(G, P(t, st + 0.3, 0.5), () => {
    card(220, 260, 700, 440, {stroke: COL.acc});
    text('McNemar', 570, 320, {size: 32, weight: 700, color: COL.acc, align: 'center'});
    [['', 'B đúng', 'B sai'], ['A đúng', '·', 'b'], ['A sai', 'c', '·']].forEach((r, i) => r.forEach((s, j) =>
      text(s, 340 + j * 180, 420 + i * 70, {size: 26, weight: (s === 'b' || s === 'c') ? 700 : 400, color: (s === 'b' || s === 'c') ? COL.hl : COL.ink, align: 'center'})));
    text('chỉ các câu hai hệ khác nhau mới tính', 570, 650, {size: 22, color: COL.mute, align: 'center'});
  });
  fade(G, P(t, st + D('test') * 0.5, 0.5), () => {
    card(1000, 260, 700, 440, {stroke: COL.frame});
    text('bootstrap', 1350, 320, {size: 32, weight: 700, color: COL.frame, align: 'center'});
    text('lấy mẫu lại tập test (có lặp)', 1350, 410, {size: 24, align: 'center'});
    text('tính lại chênh lệch, nhiều lần', 1350, 460, {size: 24, align: 'center'});
    text('→ phân bố của chênh lệch', 1350, 540, {size: 26, weight: 700, color: COL.frame, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['!', '1 200 câu, 72%: khoảng ± 2,5 điểm', COL.frame], ['✗', 'chênh nhỏ hơn khoảng tin cậy thì chưa kết luận', COL.hl], ['+', 'cộng thêm phần do seed · dùng McNemar hoặc bootstrap', COL.ok]].forEach(([m, a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.6, 0.6), () => {
      text(m, 300, 300 + j * 90, {size: 34, weight: 700, color: c});
      text(a, 350, 300 + j * 90, {size: 30});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 760, 640, 'Phần 5: rò rỉ dữ liệu  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 4', [
  ['khoảng tin cậy', 'confidence interval', '95%'],
  ['độ lệch chuẩn', 'standard deviation', 'qua các seed'],
  ['kiểm định McNemar', 'McNemar test', 'đếm câu A đúng B sai'],
  ['lấy mẫu lại có lặp', 'bootstrap', ''],
  ['có ý nghĩa thống kê', 'statistically significant', ''],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'formula', to: 'n', draw: shotCI},
    {from: 'ua', to: 'test', draw: shotMore},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/eval-4-tin-cay.wav');
</script>
</body>
</html>
