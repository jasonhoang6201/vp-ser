<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MFCC 6: Ngày nay</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/dsp.js"></script>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/06-ngay-nay.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, axes, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;

const a2 = DSP.frameInfo(DSP.envA, 200), LDB = a2.ldb;
const LLO = Math.min(...LDB), LHI = Math.max(...LDB);

function cross(x1, y1, x2, y2) { line(x1, y1, x2, y2, COL.hl, 4); line(x1, y2, x2, y1, COL.hl, 4); }

/* ---------- shots ---------- */

const shotIntro = UI.introShot('MFCC ngày nay', 'Phần 6/6: vì sao log-Mel thay chỗ MFCC', 5);

function shotEra(G, t) {
  const s = S('era'), sd = S('dnn'), sf = S('fbank'), df = D('fbank');
  heading('1980 – 2010: thời của MFCC');
  const x0 = 200, x1 = 1720, Xy = y => x0 + (y - 1978) / 48 * (x1 - x0), ty = 300;
  fade(G, P(t, s + 0.2, 0.6), () => {
    line(x0, ty, x1, ty, COL.line2, 3);
    [1980, 1990, 2000, 2010, 2020].forEach(y => { line(Xy(y), ty - 8, Xy(y), ty + 8, COL.line2, 2); text(String(y), Xy(y), ty + 34, {size: 20, color: COL.mute, align: 'center'}); });
    rrect(Xy(1980), ty - 60, Xy(2010) - Xy(1980), 40, 8, COL.accSoft, COL.acc);
    text('MFCC 39 chiều + GMM-HMM', (Xy(1980) + Xy(2010)) / 2, ty - 40, {size: 22, weight: 700, color: COL.acc, align: 'center'});
  });
  fade(G, P(t, s + D('era') * 0.5, 0.6), () => {
    card(200, 420, 760, 330);
    text('Mỗi bước hợp với Gauss đường chéo', 230, 464, {size: 26, weight: 700});
    [['log', 'phân bố gần Gauss hơn'], ['DCT', 'khử tương quan → đường chéo'], ['giữ 13', 'ít tham số, ít dữ liệu']].forEach(([a, b], j) => {
      text(a, 250, 530 + j * 64, {size: 26, weight: 700, color: COL.acc});
      text(b, 400, 530 + j * 64, {size: 24, color: COL.mute});
    });
  });
  fade(G, P(t, sd + 0.2, 0.6), () => {
    G.beginPath(); G.arc(Xy(2012), ty, 11, 0, 2 * Math.PI); G.fillStyle = COL.frame; G.fill();
    text('2012: DNN thay GMM', Xy(2012), ty - 90, {size: 22, weight: 700, color: COL.frame, align: 'center'});
    card(1000, 420, 720, 150);
    text('DNN (Hinton và cộng sự, 2012)', 1030, 464, {size: 26, weight: 700, color: COL.frame});
    text('không cần đầu vào độc lập: tự học quan hệ', 1030, 520, {size: 24, color: COL.mute});
  });
  fade(G, P(t, sf + 0.2, 0.6), () => {
    card(1000, 600, 720, 150, {stroke: COL.ok, lw: 3});
    text('Mohamed, Hinton, Penn (2012)', 1030, 644, {size: 26, weight: 700, color: COL.ok});
    text('đưa thẳng log-Mel (bỏ DCT): tốt hơn MFCC', 1030, 700, {size: 24, color: COL.ink});
  });
  fade(G, P(t, sf + df * 0.7, 0.5), () => {
    G.beginPath(); G.arc(Xy(2020), ty, 9, 0, 2 * Math.PI); G.fillStyle = COL.ok; G.fill();
    text('log-Mel, sóng âm thô', Xy(2020), ty + 70, {size: 22, weight: 700, color: COL.ok, align: 'center'});
  });
}

function shotWhy(G, t) {
  const s1 = S('why1'), s2 = S('why2'), d2 = D('why2'), s3 = S('why3');
  heading('Vì sao DCT có hại cho DNN?');
  const col = (x, n, title, at) => fade(G, P(t, at, 0.6), () => {
    card(x, 220, 560, 560);
    text(String(n), x + 30, 268, {size: 30, weight: 700, color: COL.hl});
    text(title, x + 70, 268, {size: 26, weight: 700});
  });
  // 1: cutting throws information away.
  col(80, 1, 'cắt 13 là vứt thông tin', s1 - 0.2);
  fade(G, P(t, s1 + 0.4, 0.6), () => {
    for (let k = 0; k < 40; k++) {
      const x = 130 + k * 11.5, keep = k < 13;
      rrect(x, 340, 9, 200, 2, keep ? COL.ok : '#ead2cf');
    }
    text('13 giữ', 130 + 6 * 11.5, 575, {size: 22, weight: 600, color: COL.ok, align: 'center'});
    text('27 bỏ', 130 + 26 * 11.5, 575, {size: 22, weight: 600, color: COL.hl, align: 'center'});
    text('nhiều dữ liệu: để mô hình tự chọn', 360, 680, {size: 22, color: COL.mute, align: 'center'});
  });
  // 2: DCT mixes every filter into each coefficient, which breaks locality in frequency.
  col(680, 2, 'DCT làm mất tính cục bộ', s2 - 0.2);
  fade(G, P(t, s2 + 0.3, 0.6), () => {
    const x = 740, y0 = 320, ch = 9;
    for (let k = 0; k < 40; k++) { G.fillStyle = Clip.heat((LDB[k] - LLO) / (LHI - LLO)); G.fillRect(x, y0 + (39 - k) * ch, 60, ch); }
    G.strokeStyle = COL.line2; G.lineWidth = 2; G.strokeRect(x, y0, 60, 40 * ch);
    text('log-Mel', x + 30, y0 - 20, {size: 20, color: COL.mute, align: 'center'});
    const ky = y0 + (39 - 16) * ch - ch * 1.5 + Math.sin((t - s2) * 1.5) * 6 * ch;
    rrect(x - 6, ky, 72, ch * 5, 4, null, COL.frame, 3);
    text('bộ lọc CNN trượt', x + 80, ky + ch * 2.5, {size: 20, weight: 600, color: COL.frame});
    text('theo tần số', x + 80, ky + ch * 2.5 + 26, {size: 20, weight: 600, color: COL.frame});
  });
  fade(G, P(t, s2 + d2 * 0.5, 0.6), () => {
    const x = 1010, y0 = 320, ch = 9, cy = y0 + 20 * ch;
    for (let k = 0; k < 40; k++) line(x, y0 + (39 - k + 0.5) * ch, x + 120, cy, 'rgba(51,126,169,0.35)', 1.2);
    rrect(x + 120, cy - 22, 70, 44, 8, COL.accSoft, COL.acc);
    text('c3', x + 155, cy, {size: 22, weight: 700, color: COL.acc, align: 'center'});
    text('mỗi hệ số trộn', x + 90, y0 + 40 * ch + 40, {size: 20, color: COL.mute, align: 'center'});
    text('cả 40 bộ lọc', x + 90, y0 + 40 * ch + 66, {size: 20, color: COL.mute, align: 'center'});
  });
  // 3: the reason for DCT is gone.
  col(1280, 3, 'lý do của DCT đã hết', s3 - 0.2);
  fade(G, P(t, s3 + 0.3, 0.6), () => {
    text('DCT ra đời để:', 1320, 360, {size: 24, color: COL.mute});
    text('khử tương quan', 1320, 410, {size: 28, weight: 700});
    text('cho Gauss đường chéo', 1320, 455, {size: 28, weight: 700});
    fade(G, P(t, s3 + D('why3') * 0.5, 0.5), () => {
      cross(1310, 380, 1620, 480);
      text('DNN không cần', 1320, 560, {size: 28, weight: 700, color: COL.hl});
    });
  });
}

function shotNow(G, t) {
  const s = S('now'), d = D('now');
  heading('Ngày nay dùng gì?');
  const rows = [
    ['Whisper', '80 log-Mel (large-v3: 128), cửa sổ 25 ms, dịch 10 ms', COL.acc, 0.05],
    ['nhiều mô hình khác', '80 filterbank (fbank)', COL.acc, 0.4],
    ['wav2vec 2.0, HuBERT', 'sóng âm thô → các lớp tích chập tự học đặc trưng', COL.ok, 0.6],
  ];
  rows.forEach(([a, b, c, at], j) => fade(G, P(t, s + d * at, 0.6), () => {
    const y = 270 + j * 160;
    card(160, y, 1600, 130);
    text(a, 200, y + 50, {size: 30, weight: 700, color: c});
    text(b, 200, y + 94, {size: 24, color: COL.mute});
    // Small glyph on the right: a log-Mel strip, or a waveform for raw-audio models.
    if (j < 2) for (let i = 0; i < 30; i++) for (let k = 0; k < 8; k++) {
      G.fillStyle = Clip.heat(0.3 + 0.5 * Math.abs(Math.sin(i * 0.4 + k * 0.9))); G.fillRect(1440 + i * 9, y + 25 + k * 10, 9, 10);
    } else {
      const xs = Array.from({length: 200}, (_, i) => 1440 + i * 1.35);
      poly(xs, xs.map((_, i) => y + 65 + 30 * Math.sin(i * 0.35) * Math.sin(i * 0.031) * Math.cos(i * 0.11)), COL.ok, 2);
    }
  }));
}

function shotStill(G, t) {
  const s = S('still'), d = D('still'), sk = S('keep'), dk = D('keep');
  heading(t > sk - 0.3 ? 'Những gì MFCC để lại' : 'MFCC vẫn còn chỗ dùng');
  if (t < sk - 0.3) {
    const items = ['thiết bị nhỏ', 'ít dữ liệu', 'GMM, SVM', 'baseline', 'đặc trưng thủ công'];
    let x = 210;
    items.forEach((it, j) => fade(G, P(t, s + d * (0.1 + j * 0.1), 0.5), () => { x += chip(G, x, 340, it, {size: 28, color: COL.ink}) + 24; }));
    fade(G, P(t, s + d * 0.75, 0.5), () => text('gọn · rẻ · dễ giải thích', 960, 520, {size: 40, weight: 700, color: COL.acc, align: 'center'}));
    return;
  }
  const steps = ['frame 25 / 10 ms', 'FFT', 'thang Mel', 'log', 'DCT', 'giữ 13'];
  let x = 180;
  steps.forEach((st, j) => fade(G, P(t, sk + dk * (0.1 + j * 0.08), 0.5), () => {
    const drop = j >= 4;
    const w = chip(G, x, 340, st, drop ? {size: 28, color: COL.mute} : {fill: '#eef6f1', stroke: COL.ok, color: COL.ok, weight: 700, size: 28});
    if (drop) fade(G, P(t, sk + dk * 0.7, 0.4), () => cross(x + 8, 348, x + w - 8, 384));
    if (j < steps.length - 1) arrow(x + w + 8, 366, x + w + 44, 366, COL.line2, 2.5, 10);
    x += w + 54;
  }));
  fade(G, P(t, sk + dk * 0.5, 0.5), () => text('vẫn sống trong log-Mel', 600, 470, {size: 30, weight: 700, color: COL.ok, align: 'center'}));
  fade(G, P(t, sk + dk * 0.75, 0.5), () => text('bị bỏ', 1120, 470, {size: 30, weight: 700, color: COL.hl, align: 'center'}));
}

function shotCompare(G, t) {
  const s = S('compare'), d = D('compare');
  heading('MFCC so với log-Mel');
  const rows = [['số chiều', '13 (39 với delta)', '40 – 128'], ['tương quan', 'ít', 'nhiều'], ['cấu trúc tần số', 'mất (DCT trộn)', 'giữ'],
    ['hợp với', 'GMM, mô hình cổ điển', 'DNN, CNN, Transformer'], ['dữ liệu cần', 'ít', 'nhiều']];
  const cx = [220, 760, 1300], y0 = 250, rh = 90;
  fade(G, P(t, s + 0.2, 0.5), () => {
    text('MFCC', cx[1], y0, {size: 32, weight: 700, color: COL.acc});
    text('log-Mel', cx[2], y0, {size: 32, weight: 700, color: COL.ok});
    line(200, y0 + 34, 1720, y0 + 34, COL.line2, 2);
  });
  rows.forEach(([a, b, c], i) => fade(G, P(t, s + d * (0.1 + i * 0.13), 0.5), () => {
    const y = y0 + 80 + i * rh;
    text(a, cx[0], y, {size: 26, color: COL.mute});
    text(b, cx[1], y, {size: 28});
    text(c, cx[2], y, {size: 28});
    line(200, y + rh / 2, 1720, y + rh / 2, '#ecebe8', 1.5);
  }));
}

function shotLesson(G, t) {
  const s = S('lesson'), d = D('lesson');
  heading('Mỗi bước gỡ một vướng của thời nó');
  const rows = [
    ['thang Mel', 'tai nghe theo tỉ lệ, cần gọn', 'vẫn dùng', COL.ok],
    ['log', 'nhân → cộng, khoảng giá trị quá rộng', 'vẫn dùng', COL.ok],
    ['DCT', 'Gauss đường chéo cần khử tương quan', 'thường bỏ', COL.hl],
    ['giữ 13', 'ít tham số, ít dữ liệu', 'thường bỏ', COL.hl],
    ['delta', 'mỗi frame chỉ là ảnh chụp', 'thường thay bằng nhìn nhiều frame', COL.frame],
    ['CMN', 'kênh truyền cộng cố định', 'chuẩn hóa vẫn hay dùng', COL.ok],
  ];
  const cx = [200, 480, 1240], y0 = 240, rh = 82;
  fade(G, P(t, s + 0.1, 0.4), () => {
    ['Bước', 'Gỡ vướng gì', 'Hôm nay'].forEach((h, j) => text(h, cx[j], y0, {size: 24, weight: 600, color: COL.mute}));
    line(180, y0 + 28, 1740, y0 + 28, COL.line2, 2);
  });
  rows.forEach(([a, b, c, col], i) => fade(G, P(t, s + 0.3 + i * d * 0.09, 0.5), () => {
    const y = y0 + 72 + i * rh;
    text(a, cx[0], y, {size: 28, weight: 700, color: COL.acc});
    text(b, cx[1], y, {size: 26});
    text(c, cx[2], y, {size: 26, weight: 600, color: col});
    line(180, y + rh / 2, 1740, y + rh / 2, '#ecebe8', 1.5);
  }));
  fade(G, P(t, s + d * 0.8, 0.5), () => chip(G, 640, 800, 'Với mọi pipeline: bước này gỡ vướng gì?', HOT));
}

const shotTerms = UI.termsShot('Tóm lại chuỗi MFCC và thuật ngữ phần 6', [
  ['cả chuỗi', 'frame → FFT → Mel → log → DCT → 13', 'MFCC, khoảng 13 số mỗi frame'],
  ['bỏ DCT và cắt', 'log-Mel filterbank (fbank)', 'đầu vào phổ biến hôm nay'],
  ['mạng nơ-ron sâu', 'DNN', 'tự học quan hệ giữa các số'],
  ['mạng tích chập', 'CNN', 'cần tính cục bộ theo tần số'],
  ['tự học từ sóng âm', 'wav2vec 2.0, HuBERT', 'không cần đặc trưng làm tay'],
  ['đặc trưng làm tay', 'hand-crafted features', 'MFCC, log-Mel, ...'],
  ['mô hình đối chứng', 'baseline', 'chỗ MFCC vẫn hay xuất hiện'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 9,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'era', to: 'fbank', draw: shotEra},
    {from: 'why1', to: 'why3', draw: shotWhy},
    {from: 'now', to: 'now', draw: shotNow},
    {from: 'still', to: 'keep', draw: shotStill},
    {from: 'compare', to: 'compare', draw: shotCompare},
    {from: 'lesson', to: 'lesson', draw: shotLesson},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/06-ngay-nay.wav');
</script>
</body>
</html>
