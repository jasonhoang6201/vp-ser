<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>SER · 3: Nhãn và dấu hiệu</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/ser.js"></script>
<script src="../build/ser-3-nhan.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Bốn thành phần', '3 Nhãn và dấu hiệu', '4 Dữ liệu', '5 Thước đo'];
const PL = {cx: 560, cy: 500, r: 270};
const PX = v => PL.cx + v * PL.r, PY = a => PL.cy - a * PL.r;
const ECOL = {'giận': COL.hl, 'sợ': COL.i, 'ghê tởm': COL.mute, 'vui': COL.ok, 'ngạc nhiên': COL.frame, 'buồn': COL.acc, 'trung tính': COL.ink, 'thư thái': COL.ok};
const TABLE = [
  ['', 'f0', 'năng lượng', 'tốc độ'],
  ['giận', 'cao, dao động mạnh', 'cao', 'nhanh'],
  ['vui', 'cao, dao động mạnh', 'khá cao', 'nhanh'],
  ['buồn', 'thấp, phẳng', 'thấp', 'chậm'],
  ['trung tính', 'vừa', 'vừa', 'vừa'],
];

function dot(x, y, r, c) { const g = Clip.g; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fillStyle = c; g.fill(); }

function plane(G, t, o = {}) {
  line(PL.cx - PL.r - 20, PL.cy, PL.cx + PL.r + 20, PL.cy, o.hv ? COL.frame : COL.line2, o.hv ? 4 : 2);
  line(PL.cx, PL.cy - PL.r - 20, PL.cx, PL.cy + PL.r + 20, o.ha ? COL.frame : COL.line2, o.ha ? 4 : 2);
  text('dễ chịu →', PL.cx + PL.r + 20, PL.cy + 30, {size: 20, weight: 700, color: COL.mute, align: 'right'});
  text('← khó chịu', PL.cx - PL.r - 20, PL.cy + 30, {size: 20, weight: 700, color: COL.mute});
  text('kích động ↑', PL.cx + 12, PL.cy - PL.r - 10, {size: 20, weight: 700, color: COL.mute});
  text('bình thản ↓', PL.cx + 12, PL.cy + PL.r + 14, {size: 20, weight: 700, color: COL.mute});
  text('valence', PL.cx + PL.r - 40, PL.cy - 20, {size: 22, weight: 700, color: o.hv ? COL.frame : COL.ink});
  text('arousal', PL.cx - 100, PL.cy - PL.r + 20, {size: 22, weight: 700, color: o.ha ? COL.frame : COL.ink});
  if (o.dots > 0) SER.VA.forEach(([l, v, a], j) => fade(G, clamp(o.dots * 8 - j), () => {
    const dim = o.focus && !o.focus.includes(l);
    G.save(); if (dim) G.globalAlpha *= 0.25;
    dot(PX(v), PY(a), 10, ECOL[l]);
    text(l, PX(v) + (v < 0 ? -16 : 16), PY(a) - 4, {size: 22, weight: 700, color: ECOL[l], align: v < 0 ? 'right' : 'left'});
    G.restore();
  }));
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('SER: đoán cảm xúc từ giọng nói', 'Phần 3/5: nhãn theo lớp, theo chiều, dấu hiệu trong giọng', 2, PARTS);

function shotMain(G, t) {
  const sp = S('plane'), spl = S('place'), st = S('table'), sa = S('arousal'), sv = S('valence'), dv = D('valence');
  heading(t < spl ? 'Nhãn theo chiều: valence × arousal' : t < st ? 'Nhãn theo lớp đặt lên mặt phẳng' : t < sa ? 'Dấu hiệu ngữ điệu' : t < sv ? 'Ngữ điệu cho biết arousal tốt' : 'Valence: ngữ điệu không đủ');
  const focus = t >= sv ? ['giận', 'vui'] : null;
  fade(G, P(t, sp + 0.3, 0.5), () => plane(G, t, {ha: t >= sa && t < sv, hv: t >= sv, dots: t < spl ? 0 : P(t, spl + 0.3, D('place') * 0.6), focus}));
  if (t >= st) fade(G, P(t, st + 0.3, 0.5), () => {
    const cx = [960, 1100, 1410, 1590];
    TABLE.forEach((row, i) => {
      const y = 280 + i * 70, hot = (t >= sa && t < sv) || (t >= sv && (i === 1 || i === 2));
      if (i) line(950, y - 35, 1780, y - 35, COL.line, 1.5);
      if (i && hot && t >= sv) rrect(950, y - 33, 830, 66, 6, COL.hlSoft);
      row.forEach((c, j) => text(c, cx[j], y, {size: i ? 24 : 22, weight: i === 0 || j === 0 ? 700 : 400, color: i === 0 ? COL.mute : j === 0 ? ECOL[c] : COL.ink}));
    });
  });
  if (t >= sa && t < sv) fade(G, P(t, sa + 0.5, 0.5), () => text('to, cao, nhanh ↔ kích động · nhỏ, thấp, chậm ↔ bình thản', 1360, 680, {size: 24, weight: 700, color: COL.ok, align: 'center'}));
  if (t >= sv) {
    fade(G, P(t, sv + 0.5, 0.5), () => {
      const [, v1, a1] = SER.VA[0], [, v2, a2] = SER.VA[3];
      arrow(PX(v1) + 20, PY(a1) + 30, PX(v2) - 20, PY(a2) + 30, COL.hl, 3);
      arrow(PX(v2) - 20, PY(a2) + 30, PX(v1) + 20, PY(a1) + 30, COL.hl, 3);
      text('ngữ điệu gần giống nhau', PL.cx, PY(0.62) + 70, {size: 22, weight: 700, color: COL.hl, align: 'center'});
    });
    fade(G, P(t, sv + dv * 0.5, 0.5), () => {
      text('cần thêm: chất giọng (căng, khàn)', 1360, 680, {size: 26, weight: 700, color: COL.frame, align: 'center'});
      text('và từ ngữ: "tuyệt quá" hay "đồ tệ hại"', 1360, 730, {size: 26, weight: 700, color: COL.frame, align: 'center'});
    });
  }
}

function shotText(G, t) {
  const st = S('text'), sk = S('knob');
  heading(t < sk ? 'Vì vậy SER dùng cả âm thanh lẫn chữ' : 'Các tham số điều khiển của trang 15');
  if (t < sk) {
    fade(G, P(t, st + 0.3, 0.5), () => {
      chip(G, 420, 320, 'âm thanh: ngữ điệu, chất giọng', {size: 28, weight: 700, color: COL.frame, stroke: COL.frame});
      chip(G, 420, 440, 'chữ: từ ngữ được nói', {size: 28, weight: 700, color: COL.acc, stroke: COL.acc});
      arrow(900, 346, 1060, 400, COL.mute, 3); arrow(780, 466, 1060, 420, COL.mute, 3);
      chip(G, 1080, 384, 'cảm xúc (trang 20, 21)', {size: 28, weight: 700, color: COL.ok, stroke: COL.ok});
    });
    fade(G, P(t, st + D('text') * 0.55, 0.5), () => text('xu hướng ở bảng thay đổi theo người, ngôn ngữ, văn hóa', 960, 640, {size: 26, color: COL.mute, align: 'center'}));
    return;
  }
  fade(G, P(t, sk + 0.3, 0.5), () => {
    const labels = ['tham số f0 (cao độ)', 'tham số năng lượng (độ to)', 'tham số tốc độ'], xs = UI.chipXs(G, labels, {size: 28, weight: 700}, 30);
    labels.forEach((l, j) => chip(G, xs[j], 380, l, {size: 28, weight: 700, color: COL.frame, stroke: COL.frame}));
    text('FastSpeech 2 vặn chúng để tạo giọng; SER đọc chúng để đoán cảm xúc', 960, 540, {size: 28, weight: 700, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['✓', 'nhãn theo lớp hoặc theo chiều (valence, arousal)', COL.ok], ['✓', 'ngữ điệu cho arousal tốt', COL.ok], ['✗', 'valence cần thêm chất giọng và từ ngữ', COL.hl]].forEach(([m, a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.6, 0.6), () => {
      text(m, 400, 300 + j * 90, {size: 34, weight: 700, color: c});
      text(a, 450, 300 + j * 90, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 760, 640, 'Phần 4: hai bộ dữ liệu  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 3', [
  ['nhãn là một lớp', 'categorical labels', 'giận, vui, buồn…'],
  ['nhãn là tọa độ', 'dimensional labels', 'valence, arousal, dominance'],
  ['mặt phẳng valence × arousal', 'mô hình circumplex (Russell)', ''],
  ['tín hiệu ngoài nội dung chữ', 'paralinguistic cues', 'f0, năng lượng, tốc độ, chất giọng'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'plane', to: 'valence', draw: shotMain},
    {from: 'text', to: 'knob', draw: shotText},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/ser-3-nhan.wav');
</script>
</body>
</html>
