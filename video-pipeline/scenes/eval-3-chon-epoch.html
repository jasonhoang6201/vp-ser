<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đánh giá · 3: Chọn epoch trên test</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../lib/gmm.js"></script>
<script src="../lib/evalx.js"></script>
<script src="../build/eval-3-chon-epoch.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Quy tắc', '3 Chọn epoch', '4 Tin cậy', '5 Rò rỉ', '6 WER'];
const R10 = EVX.selection(10, 1.2), R30 = EVX.selection(30, 1.2), RSD = EVX.selection(10, 2.5);
const f1 = v => v.toFixed(1).replace('.', ',');

const X0 = 260, X1 = 1180, Y0 = 820, Y1 = 260, LO = 26, HI = 34;
const ys = v => Y0 - (v - LO) / (HI - LO) * (Y0 - Y1);
function axes() {
  line(X0, Y0, X1, Y0, COL.line2, 2);
  line(X0, Y0, X0, Y1, COL.line2, 2);
  [26, 28, 30, 32, 34].forEach(v => { text(`${v}`, X0 - 16, ys(v) + 8, {size: 20, color: COL.mute, align: 'right'}); line(X0, ys(v), X1, ys(v), COL.line, 1); });
  text('epoch', (X0 + X1) / 2, Y0 + 50, {size: 22, color: COL.mute, align: 'center'});
  text('UA trên test', X0, Y1 - 24, {size: 22, color: COL.mute});
}

const shotIntro = UI.introShot('Đánh giá cho đúng', 'Phần 3/6: chọn epoch trên test làm số đẹp lên bao nhiêu', 2, PARTS);

function shotOne(G, t) {
  const ss = S('setup'), so = S('one');
  heading(t < so ? 'Khả năng thật: UA 30, mỗi epoch đo dao động quanh 30' : 'Một lần chạy 10 epoch');
  fade(G, P(t, ss + 0.3, 0.5), () => {
    axes();
    line(X0, ys(30), X1, ys(30), COL.ok, 3, [10, 8]);
    text('sự thật: 30', X1 + 14, ys(30) + 8, {size: 22, weight: 700, color: COL.ok});
  });
  if (t < so) {
    fade(G, P(t, ss + D('setup') * 0.4, 0.5), () => {
      rrect(X0 + 2, ys(31.2), X1 - X0 - 4, ys(28.8) - ys(31.2), 0, COL.acc + '18');
      text('± 1,2 (độ lệch chuẩn)', X1 + 14, ys(31.2) + 8, {size: 20, color: COL.acc});
    });
    return;
  }
  const u = clamp((t - so - 0.3) / 3, 0, 1), xs = R10.one.map((_, i) => X0 + 60 + i * 88);
  poly(xs, R10.one.map(ys), COL.acc, 3, null, u);
  R10.one.forEach((v, i) => {
    if (i > u * 9 + 1e-6) return;
    G.fillStyle = COL.acc; G.beginPath(); G.arc(xs[i], ys(v), 7, 0, 7); G.fill();
    text(`${i + 1}`, xs[i], Y0 + 26, {size: 18, color: COL.mute, align: 'center'});
  });
  const im = R10.one.indexOf(Math.max(...R10.one));
  fade(G, P(t, so + 4, 0.5), () => {
    G.strokeStyle = COL.hl; G.lineWidth = 4; G.beginPath(); G.arc(xs[im], ys(R10.one[im]), 16, 0, 7); G.stroke();
    card(1330, 330, 480, 200, {stroke: COL.hl});
    text('max trên test', 1570, 400, {size: 26, weight: 700, color: COL.hl, align: 'center'});
    text(f1(R10.one[im]), 1570, 480, {size: 52, weight: 700, color: COL.hl, align: 'center'});
    text(`dao động ${f1(Math.min(...R10.one))} → ${f1(Math.max(...R10.one))}`, 1570, 600, {size: 22, color: COL.mute, align: 'center'});
  });
}

function bars(rows, t, s) {
  rows.forEach(([l, v, c], j) => {
    const y = 290 + j * 120, w = (v - 26) / 9 * 1000 * clamp((t - s - 0.3 - j * 0.6) / 0.8, 0, 1);
    text(l, 560, y + 44, {size: 26, weight: 700, align: 'right', maxW: 380});
    rrect(590, y, w, 64, 6, c + '33', c, 2);
    if (w > 0) text(f1(v), 600 + w, y + 44, {size: 28, weight: 700, color: c});
  });
  const x30 = 590 + 4 / 9 * 1000;
  line(x30, 270, x30, 290 + rows.length * 120, COL.ok, 2, [8, 6]);
  text('sự thật 30', x30, 260, {size: 20, weight: 700, color: COL.ok, align: 'center'});
}

function shotAvg(G, t) {
  const sa = S('avg'), sm = S('more'), sd = S('dev'), sr = S('real');
  heading(t < sm ? 'Trung bình 2 000 lần mô phỏng, 10 epoch' : t < sd ? 'Thử càng nhiều càng cao' : t < sr ? 'Chọn bằng dev thì không thổi phồng' : 'Thực tế vẫn phải chọn epoch');
  if (t < sm || (t >= sd && t < sr)) {
    bars([['epoch cuối', R10.last, COL.mute], ['chọn theo dev', R10.dev, COL.ok], ['max trên test', R10.max, COL.hl]], t, t < sm ? sa : sd - 10);
    const at = t < sm ? sa + 3 : sd + 0.3;
    fade(G, P(t, at, 0.5), () => chip(G, 1330, 560, `thổi phồng +${f1(R10.max - 30)}`, {size: 28, weight: 700, color: COL.hl, stroke: COL.hl}));
    if (t >= sd) fade(G, P(t, sd + 0.8, 0.5), () => text('dev và test dao động độc lập: may trên dev không mang sang test', 960, 760, {size: 26, weight: 700, color: COL.ok, align: 'center'}));
    return;
  }
  if (t < sd) {
    bars([['10 epoch, lệch 1,2', R10.max, COL.hl], ['30 epoch, lệch 1,2', R30.max, COL.hl], ['10 epoch, lệch 2,5', RSD.max, COL.hl]], t, sm);
    fade(G, P(t, sm + 2.5, 0.5), () => text('cùng một mô hình, chỉ khác số lần "thử vận may"', 960, 700, {size: 26, color: COL.mute, align: 'center'}));
    return;
  }
  fade(G, P(t, sr + 0.3, 0.5), () => {
    const xs = Array.from({length: 30}, (_, i) => 300 + i * 44), cv = xs.map((_, i) => 24 + 8 * (1 - Math.exp(-i / 5)) - 0.12 * Math.max(0, i - 12));
    line(280, 780, 1620, 780, COL.line2, 2);
    poly(xs, cv.map(v => 780 - (v - 22) * 45), COL.acc, 4);
    const ib = cv.indexOf(Math.max(...cv));
    line(xs[ib], 780, xs[ib], 780 - (cv[ib] - 22) * 45, COL.ok, 3, [8, 6]);
    text('tốt dần', 470, 560, {size: 26, weight: 700, color: COL.acc});
    text('học thuộc, tụt', 1350, 520, {size: 26, weight: 700, color: COL.hl});
    text('chọn chỗ này, bằng dev', xs[ib], 820, {size: 24, weight: 700, color: COL.ok, align: 'center'});
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['✗', 'max trên test luôn cao hơn sự thật, thử càng nhiều càng cao', COL.hl], ['✓', 'chọn epoch bằng dev, chấm test một lần', COL.ok]].forEach(([m, a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.8, 0.6), () => {
      text(m, 300, 320 + j * 100, {size: 34, weight: 700, color: c});
      text(a, 350, 320 + j * 100, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.75, 0.5), () => chip(G, 680, 600, 'Phần 4: chênh bao nhiêu thì đáng tin  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 3', [
  ['chọn epoch trên tập thử', 'test-set selection', 'thổi phồng kết quả'],
  ['dừng sớm theo tập kiểm', 'early stopping', ''],
  ['học thuộc tập học', 'overfitting', ''],
  ['mô phỏng nhiều lần ngẫu nhiên', 'Monte Carlo simulation', ''],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'setup', to: 'one', draw: shotOne},
    {from: 'avg', to: 'real', draw: shotAvg},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/eval-3-chon-epoch.wav');
</script>
</body>
</html>
