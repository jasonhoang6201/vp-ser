<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ASR cổ điển 5: WER</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/asr-5-wer.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Bốn thành phần', '3 Từ điển, triphone', '4 Mô hình ngôn ngữ', '5 WER'];
const OPC = {C: COL.ok, S: COL.frame, D: COL.hl, I: COL.i}, OPN = {C: 'đúng', S: 'thay (S)', D: 'thiếu (D)', I: 'thừa (I)'};

// Edit-distance table and one cheapest alignment, same rule as demo/08.
function editTable(ref, hyp) {
  const n = ref.length, m = hyp.length, T = Array.from({length: n + 1}, (_, i) => Array.from({length: m + 1}, (_, j) => (i === 0 ? j : j === 0 ? i : 0)));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    T[i][j] = Math.min(T[i - 1][j - 1] + (ref[i - 1] === hyp[j - 1] ? 0 : 1), T[i - 1][j] + 1, T[i][j - 1] + 1);
  const ops = [], cells = [[n, m]];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && T[i][j] === T[i - 1][j - 1] + (ref[i - 1] === hyp[j - 1] ? 0 : 1)) { ops.push([ref[i - 1] === hyp[j - 1] ? 'C' : 'S', ref[i - 1], hyp[j - 1]]); i--; j--; }
    else if (i > 0 && T[i][j] === T[i - 1][j] + 1) { ops.push(['D', ref[i - 1], '']); i--; }
    else { ops.push(['I', '', hyp[j - 1]]); j--; }
    cells.push([i, j]);
  }
  return {T, ops: ops.reverse(), cells};
}
const REF = 'hôm nay trời mưa rất to'.split(' '), HYP = 'ừ hôm qua trời mưa to'.split(' ');
const AL = editTable(REF, HYP);
const REF2 = 'trời mưa'.split(' '), HYP2 = 'ơ trời mưa to quá'.split(' '), AL2 = editTable(REF2, HYP2);

function alignView(ops, x0, y, o = {}) {
  const w = o.w || 170, n = Math.ceil(ops.length * (o.upto == null ? 1 : o.upto));
  text('đúng', x0 - 20, y + 30, {size: 22, color: COL.mute, align: 'right'});
  text('đoán', x0 - 20, y + 100, {size: 22, color: COL.mute, align: 'right'});
  ops.slice(0, n).forEach(([op, r, h], k) => {
    const x = x0 + k * w, c = OPC[op], soft = op === 'C' ? '#e8f3ec' : c + '1c';
    rrect(x, y, w - 14, 130, 12, soft, c, op === 'C' ? 1.5 : 3);
    text(r || '·', x + (w - 14) / 2, y + 30, {size: 28, weight: 700, color: r ? COL.ink : COL.line2, align: 'center'});
    line(x + 14, y + 65, x + w - 28, y + 65, c + '55', 1.5);
    text(h || '·', x + (w - 14) / 2, y + 100, {size: 28, weight: 700, color: h ? COL.ink : COL.line2, align: 'center'});
    if (o.labels !== false) text(OPN[op], x + (w - 14) / 2, y + 160, {size: 22, weight: 700, color: c, align: 'center'});
  });
}

/* ---------- shots ---------- */

const shotIntro = UI.introShot('Hệ ASR cổ điển', 'Phần 5/5: WER, đo bằng cách đếm số lần sửa', 4, PARTS);

function shotNaive(G, t) {
  const s = S('naive'), d = D('naive');
  heading('Cách ngây thơ: so từng vị trí');
  const ref = REF, hyp = REF.slice(1), w = 190, x0 = 960 - ref.length * w / 2;
  fade(G, P(t, s + 0.3, 0.5), () => {
    text('đúng', x0 - 20, 300, {size: 22, color: COL.mute, align: 'right'});
    text('đoán', x0 - 20, 400, {size: 22, color: COL.mute, align: 'right'});
    ref.forEach((r, k) => {
      const h = hyp[k] || '', u = P(t, s + 1 + k * 0.35, 0.3), bad = r !== h;
      rrect(x0 + k * w, 270, w - 16, 60, 10, COL.card, COL.line2, 1.5);
      text(r, x0 + k * w + (w - 16) / 2, 300, {size: 28, weight: 700, align: 'center'});
      rrect(x0 + k * w, 370, w - 16, 60, 10, u > 0 && bad ? COL.hlSoft : COL.card, u > 0 && bad ? COL.hl : COL.line2, u > 0 && bad ? 3 : 1.5);
      text(h || '·', x0 + k * w + (w - 16) / 2, 400, {size: 28, weight: 700, color: h ? COL.ink : COL.line2, align: 'center'});
      if (u > 0) text(bad ? '✗' : '✓', x0 + k * w + (w - 16) / 2, 470, {size: 30, weight: 700, color: bad ? COL.hl : COL.ok, align: 'center'});
    });
  });
  fade(G, P(t, s + d * 0.6, 0.5), () => {
    card(460, 560, 1000, 140, {stroke: COL.hl});
    text('chỉ thiếu "hôm", nhưng 6 / 6 vị trí bị tính sai', 960, 610, {size: 30, weight: 700, color: COL.hl, align: 'center'});
    text('mọi từ phía sau lệch chỗ', 960, 660, {size: 24, color: COL.mute, align: 'center'});
  });
}

function shotOps(G, t) {
  const sr = S('refhyp'), so = S('ops'), dop = D('ops'), sf = S('formula');
  heading('Đếm số thao tác ít nhất');
  fade(G, P(t, sr + 0.3, 0.5), () => {
    chip(G, 420, 220, 'câu đoán (hypothesis)', {size: 28, weight: 700, color: COL.frame, stroke: COL.frame});
    arrow(790, 246, 1060, 246, COL.mute, 3);
    text('ít thao tác nhất', 925, 216, {size: 22, color: COL.mute, align: 'center'});
    chip(G, 1080, 220, 'câu đúng (reference)', {size: 28, weight: 700, color: COL.ok, stroke: COL.ok});
  });
  [['S', 'thay thế (substitution)', 'đoán sai một từ', 'mưa → mua'],
   ['D', 'thiếu (deletion)', 'bỏ sót một từ', 'rất → ·'],
   ['I', 'thừa (insertion)', 'thêm một từ không có', '· → ừ']].forEach(([k, n, m, ex], j) =>
    fade(G, P(t, so + 0.6 + j * dop * 0.25, 0.5), () => {
      const x = 240 + j * 500, c = OPC[k];
      card(x, 340, 440, 230, {stroke: c, lw: 2.5});
      text(k, x + 40, 400, {size: 48, weight: 700, color: c});
      text(n, x + 100, 390, {size: 24, weight: 700, color: c});
      text(m, x + 100, 425, {size: 22, color: COL.mute});
      text(ex, x + 40, 510, {size: 28, weight: 700, mono: true});
    }));
  fade(G, P(t, sf + 0.3, 0.5), () => {
    text('WER = (S + D + I) / N', 960, 680, {size: 52, weight: 700, color: COL.acc, align: 'center'});
    text('N = số từ của câu đúng', 960, 750, {size: 26, color: COL.mute, align: 'center'});
  });
}

function shotExample(G, t) {
  const se = S('example'), sa = S('align'), da = D('align'), sc = S('calc');
  heading('Ví dụ');
  fade(G, P(t, se + 0.3, 0.5) * (1 - P(t, sa, 0.4)), () => {
    text('câu đúng:', 460, 340, {size: 28, color: COL.mute, align: 'right'});
    text('"hôm nay trời mưa rất to"   (N = 6)', 490, 340, {size: 34, weight: 700, color: COL.ok});
    text('câu đoán:', 460, 430, {size: 28, color: COL.mute, align: 'right'});
    text('"ừ hôm qua trời mưa to"', 490, 430, {size: 34, weight: 700, color: COL.frame});
  });
  fade(G, P(t, sa + 0.3, 0.5), () => alignView(AL.ops, 380, 260, {upto: P(t, sa + 0.4, da * 0.7)}));
  fade(G, P(t, sc + 0.3, 0.5), () => {
    const c = {S: 0, D: 0, I: 0}; AL.ops.forEach(([o]) => { if (o in c) c[o]++; });
    text(`S = ${c.S},  D = ${c.D},  I = ${c.I},  N = ${REF.length}`, 960, 560, {size: 34, weight: 700, align: 'center'});
    text(`WER = ${c.S + c.D + c.I} / ${REF.length} = ${Math.round(100 * (c.S + c.D + c.I) / REF.length)}%`, 960, 640, {size: 48, weight: 700, color: COL.acc, align: 'center'});
  });
}

function shotDp(G, t) {
  const s = S('dp'), d = D('dp');
  heading('Căn bằng quy hoạch động');
  const cw = 92, ch = 62, x0 = 640, y0 = 290, n = REF.length, m = HYP.length;
  const shown = Math.ceil((n + 1) * P(t, s + 0.6, d * 0.45));
  fade(G, P(t, s + 0.3, 0.5), () => {
    HYP.forEach((h, j) => text(h, x0 + (j + 1.5) * cw, y0 - 22, {size: 24, weight: 700, color: COL.frame, align: 'center'}));
    REF.forEach((r, i) => text(r, x0 - 16, y0 + (i + 1.5) * ch, {size: 24, weight: 700, color: COL.ok, align: 'right'}));
    text('câu đoán →', x0 + (m + 1) * cw + 20, y0 - 22, {size: 20, color: COL.mute});
    text('câu đúng ↓', x0 - 16, y0 - 22, {size: 20, color: COL.mute, align: 'right'});
    const onPath = new Set(AL.cells.map(([i, j]) => `${i},${j}`)), back = t > s + d * 0.55;
    for (let i = 0; i <= n; i++) for (let j = 0; j <= m; j++) {
      const hot = back && onPath.has(`${i},${j}`);
      rrect(x0 + j * cw + 2, y0 + i * ch + 2, cw - 4, ch - 4, 8, hot ? COL.frameSoft : i < shown ? COL.card : '#f4f3f0', hot ? COL.frame : COL.line, hot ? 3 : 1.5);
      if (i < shown) text(String(AL.T[i][j]), x0 + (j + 0.5) * cw, y0 + (i + 0.5) * ch, {size: 24, weight: hot ? 700 : 400, color: hot ? COL.frame : COL.ink, align: 'center'});
    }
  });
  fade(G, P(t, s + 1, 0.5), () => {
    card(160, 300, 400, 230, {stroke: COL.acc});
    text('ô (i, j) =', 190, 350, {size: 24, weight: 700, color: COL.acc});
    text('min của 3 ô trước + 1', 190, 395, {size: 24});
    text('(hoặc + 0 nếu hai từ giống)', 190, 435, {size: 20, color: COL.mute});
    text('giống Viterbi: giữ cách rẻ nhất', 190, 490, {size: 22, weight: 700, color: COL.acc});
  });
  fade(G, P(t, s + d * 0.75, 0.5), () => text('khoảng cách Levenshtein (1965)', 1500, 560, {size: 26, weight: 700, color: COL.mute, align: 'center'}));
}

function shotOver(G, t) {
  const s = S('over'), d = D('over');
  heading('WER có thể vượt 100%');
  fade(G, P(t, s + 0.3, 0.5), () => alignView(AL2.ops, 560, 280, {upto: P(t, s + 0.6, 1.5)}));
  fade(G, P(t, s + d * 0.45, 0.5), () => {
    text('S = 0,  D = 0,  I = 3,  N = 2', 960, 560, {size: 34, weight: 700, align: 'center'});
    text('WER = 3 / 2 = 150%', 960, 640, {size: 48, weight: 700, color: COL.hl, align: 'center'});
    text('số từ thừa không bị giới hạn', 960, 710, {size: 26, color: COL.mute, align: 'center'});
  });
}

function shotViet(G, t) {
  const s = S('viet'), d = D('viet');
  heading('Đếm trên đơn vị nào?');
  fade(G, P(t, s + 0.3, 0.5), () => {
    card(240, 260, 680, 360, {stroke: COL.acc});
    text('tiếng Việt: tách theo âm tiết', 280, 320, {size: 28, weight: 700, color: COL.acc});
    ['hôm', 'nay', 'trời', 'mưa'].forEach((w, j) => chip(G, 280 + j * 150, 380, w, {size: 28, weight: 700}));
    text('WER tính trên âm tiết', 280, 530, {size: 26});
  });
  fade(G, P(t, s + d * 0.5, 0.5), () => {
    card(1000, 260, 680, 360, {stroke: COL.i});
    text('tiếng Trung, Nhật: không có dấu cách', 1040, 320, {size: 28, weight: 700, color: COL.i});
    ['今', '天', '下', '雨'].forEach((w, j) => chip(G, 1040 + j * 100, 380, w, {size: 30, weight: 700}));
    text('CER (Character Error Rate)', 1040, 500, {size: 26, weight: 700});
    text('cùng công thức, tính trên ký tự', 1040, 545, {size: 24, color: COL.mute});
  });
}

function shotEra(G, t) {
  const s = S('era'), d = D('era');
  heading('Hệ ASR cổ điển, 1990–2010');
  fade(G, P(t, s + 0.3, 0.5), () => {
    let x = 200;
    [['MFCC', COL.ink], ['GMM-HMM', COL.acc], ['triphone', COL.acc], ['từ điển', COL.ok], ['n-gram', COL.i], ['WER', COL.hl]].forEach(([l, c], j) => {
      const w = chip(G, x, 280, l, {size: 28, weight: 700, color: c, stroke: c});
      if (j < 5) text('+', x + w + 22, 306, {size: 30, weight: 700, color: COL.mute, align: 'center'});
      x += w + 44;
    });
    text('bộ công cụ: HTK, rồi Kaldi', 960, 400, {size: 28, color: COL.mute, align: 'center'});
  });
  fade(G, P(t, s + d * 0.55, 0.5), () => {
    card(360, 480, 1200, 230, {stroke: COL.frame});
    text('các trang sau: mạng nơ-ron thay từng thành phần', 400, 535, {size: 30, weight: 700, color: COL.frame});
    [['DNN-HMM', 'thay GMM'], ['CTC, attention', 'bỏ HMM, bớt từ điển'], ['SSL, Whisper', 'học từ rất nhiều dữ liệu']].forEach(([a, b], j) => {
      chip(G, 400 + j * 380, 590, a, HOT);
      text(b, 400 + j * 380, 676, {size: 22, color: COL.mute});
    });
  });
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  fade(G, P(t, s + 0.3, 0.5), () => text('WER = (S + D + I) / N', 960, 290, {size: 48, weight: 700, color: COL.acc, align: 'center'}));
  [['căn hai câu bằng quy hoạch động (Levenshtein)'], ['có thể vượt 100%'], ['tiếng Việt tính trên âm tiết; không có dấu cách thì CER']].forEach(([a], j) =>
    fade(G, P(t, s + 1.5 + j * 1.6, 0.6), () => {
      text('✓', 420, 400 + j * 80, {size: 34, weight: 700, color: COL.ok});
      text(a, 470, 400 + j * 80, {size: 30});
    }));
  fade(G, P(t, s + D('result') * 0.85, 0.5), () => chip(G, 760, 680, 'Trang sau: DNN-HMM  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 5', [
  ['câu đúng, câu đoán', 'reference, hypothesis', 'so câu đoán với câu đúng'],
  ['thay, thiếu, thừa', 'substitution, deletion, insertion', 'S, D, I'],
  ['tỉ lệ lỗi từ', 'WER (Word Error Rate)', '(S + D + I) / N'],
  ['số lần sửa ít nhất', 'khoảng cách Levenshtein (edit distance)', 'tính bằng quy hoạch động'],
  ['tỉ lệ lỗi ký tự', 'CER (Character Error Rate)', 'ngôn ngữ không có dấu cách'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'naive', to: 'naive', draw: shotNaive},
    {from: 'refhyp', to: 'formula', draw: shotOps},
    {from: 'example', to: 'calc', draw: shotExample},
    {from: 'dp', to: 'dp', draw: shotDp},
    {from: 'over', to: 'over', draw: shotOver},
    {from: 'viet', to: 'viet', draw: shotViet},
    {from: 'era', to: 'era', draw: shotEra},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/asr-5-wer.wav');
</script>
</body>
