<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ghép âm thanh và chữ · 1: Vấn đề</title>
<style>
html,body{margin:0;background:#e9e8e4}
canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:0 auto;background:#fbfbfa}
#bar{position:fixed;left:8px;bottom:6px;font:13px system-ui;color:#787774}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/ui.js"></script>
<script src="../build/fus-1-van-de.data.js"></script>
<script>
const {COL, S, E, D, P, text, rrect, line, poly, arrow, clamp, lerp} = Clip;
const {card, heading, fade, chip, HOT} = UI;
const PARTS = ['1 Vấn đề', '2 Các kiểu ghép', '3 Ghép muộn, cổng', '4 Cross-attention', '5 Ngữ cảnh'];
// [segment, situation, audio says, text says, which side is right: 'a' | 't' | '?']
const ROWS = [
  ['c1', '"Oh great, just great." (mỉa mai)', 'giận: giọng gằn, to', 'vui: "great"', 'a'],
  ['c2', 'ASR chép sai từ cảm xúc', 'buồn: giọng trầm, chậm', 'trung tính: từ quan trọng mất', 'a'],
  ['c3', 'giận và vui đều to, nhanh', 'không phân biệt được', 'phân biệt được', 't'],
  ['c4', '"Thật à?"', 'ngạc nhiên', 'không đủ: tùy câu trước', '?'],
];

/* ---------- shots ---------- */

const shotIntro = UI.introShot('Ghép âm thanh và chữ', 'Phần 1/5: mỗi nguồn chỉ có một phần thông tin', 0, PARTS);

function shotPlace(G, t) {
  const s = S('place');
  heading('Hai vector, ghép thế nào?');
  fade(G, P(t, s + 0.3, 0.5), () => {
    chip(G, 340, 330, 'vector âm thanh (trang 19)', {size: 28, weight: 700, color: COL.frame, stroke: COL.frame});
    chip(G, 340, 450, 'vector chữ (trang 20)', {size: 28, weight: 700, color: COL.acc, stroke: COL.acc});
    arrow(760, 356, 900, 410, COL.mute, 3); arrow(700, 476, 900, 420, COL.mute, 3);
    rrect(920, 370, 200, 90, 14, COL.soft, COL.line2, 2);
    text('?', 1020, 415, {size: 44, weight: 700, color: COL.hl, align: 'center'});
    arrow(1130, 415, 1230, 415, COL.mute, 3);
    chip(G, 1250, 389, 'cảm xúc', {size: 28, weight: 700, color: COL.ok, stroke: COL.ok});
    text('+ các câu trước trong hội thoại?', 960, 600, {size: 28, weight: 700, color: COL.i, align: 'center'});
  });
}

function shotTable(G, t) {
  heading('Mỗi nguồn chỉ có một phần thông tin');
  const cx = [180, 820, 1300];
  fade(G, P(t, S('c1') + 0.2, 0.4), () => {
    text('tình huống', cx[0], 250, {size: 24, weight: 700, color: COL.mute});
    text('âm thanh nói', cx[1], 250, {size: 24, weight: 700, color: COL.frame});
    text('chữ nói', cx[2], 250, {size: 24, weight: 700, color: COL.acc});
    line(160, 276, 1780, 276, COL.line2, 2);
  });
  ROWS.forEach(([id, a, b, c, ok], i) => fade(G, P(t, S(id) + 0.2, 0.5), () => {
    const y = 330 + i * 110, on = t >= S(id) && t < E(id) + 0.3;
    if (on) rrect(160, y - 44, 1620, 88, 8, COL.frameSoft);
    text(a, cx[0], y, {size: 25, weight: 700, maxW: 600});
    text(b, cx[1], y, {size: 25, color: ok === 'a' ? COL.ok : ok === 't' ? COL.hl : COL.ink});
    text(c, cx[2], y, {size: 25, color: ok === 't' ? COL.ok : COL.hl});
    line(160, y + 50, 1780, y + 50, COL.line, 1.5);
  }));
}

function shotGoal(G, t) {
  const s = S('goal'), d = D('goal');
  heading('Mục tiêu');
  [['nguồn nào đáng tin hơn ở câu đó thì nghe nhiều hơn', 'phần 2–4'], ['câu đứng riêng không đủ nghĩa: dùng thêm các câu trước', 'phần 5']].forEach(([l, p], j) =>
    fade(G, P(t, s + 0.3 + j * d * 0.4, 0.5), () => {
      text('✓', 300, 340 + j * 110, {size: 36, weight: 700, color: COL.ok});
      text(l, 350, 340 + j * 110, {size: 32});
      text(p, 1620, 340 + j * 110, {size: 24, color: COL.frame, align: 'right'});
    }));
}

function shotResult(G, t) {
  const s = S('result');
  heading('Tóm lại');
  [['✗', 'âm thanh, chữ: mỗi bên chỉ có một phần thông tin', COL.hl], ['✓', 'cần ghép thông minh', COL.ok], ['✓', 'cần ngữ cảnh hội thoại', COL.ok]].forEach(([m, a, c], j) =>
    fade(G, P(t, s + 0.3 + j * 1.4, 0.6), () => {
      text(m, 580, 300 + j * 90, {size: 34, weight: 700, color: c});
      text(a, 630, 300 + j * 90, {size: 32});
    }));
  fade(G, P(t, s + D('result') * 0.8, 0.5), () => chip(G, 810, 640, 'Phần 2: các kiểu ghép  →', HOT));
}

const shotTerms = UI.termsShot('Thuật ngữ phần 1', [
  ['một nguồn thông tin (âm thanh, chữ, hình)', 'modality', ''],
  ['dùng nhiều nguồn', 'đa phương thức (multimodal)', ''],
  ['ghép các nguồn', 'fusion', 'phần 2–4'],
], 'terms');

Clip.init({
  spec: window.SPEC, durations: window.DUR.durations, tail: 8,
  shots: [
    {from: 'intro', to: 'intro', draw: shotIntro},
    {from: 'place', to: 'place', draw: shotPlace},
    {from: 'c1', to: 'c4', draw: shotTable},
    {from: 'goal', to: 'goal', draw: shotGoal},
    {from: 'result', to: 'result', draw: shotResult},
    {from: 'terms', to: '$end', draw: shotTerms},
  ],
});
if (!window.RENDERING) Clip.preview('../build/fus-1-van-de.wav');
</script>
</body>
</html>
